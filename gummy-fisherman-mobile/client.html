<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gummy "The FisherMan"</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#071427; --panel:#0f2140; --panel2:#132b52; --line:#2c5a96; --glow:#5fb8ff;
    --text:#eaf4ff; --muted:#93acd0; --good:#35d07f; --bad:#ff5a6e; --gold:#ffc53d;
    --common:#a6b3c4; --rare:#3b9bff; --epic:#b45cff; --legendary:#ffb020; --mythical:#ff5fd2; --money:#6dfcae;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Nunito,-apple-system,BlinkMacSystemFont,sans-serif}
  body{background:radial-gradient(120% 60% at 50% 0%,#12325f 0%,#071427 60%) fixed}
  button{font:inherit;color:inherit;cursor:pointer}
  .h{font-family:"Lilita One",Nunito,sans-serif;letter-spacing:.02em;font-weight:400}
  .screen{max-width:1100px;margin:0 auto;padding:14px 14px 28px}
  [hidden]{display:none!important}

  /* ---------- lobby ---------- */
  .logo{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 14px}
  .logo img{width:74px;height:74px;border-radius:22px;object-fit:cover;box-shadow:0 0 0 3px #ff7fd8,0 10px 30px rgba(255,95,210,.35)}
  .logo-t{line-height:.95;text-align:left}
  .logo-t .a{font-size:34px;color:#ff8fe0;text-shadow:0 3px 0 #8a1f73,0 0 22px rgba(255,120,220,.45)}
  .logo-t .b{font-size:22px;color:#7fd3ff;text-shadow:0 2px 0 #0d3b73}
  .tagline{text-align:center;color:var(--muted);font-weight:800;font-size:14px;margin:-4px 0 14px}
  .timebox{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:14px}
  .timebox label{font-size:11px;letter-spacing:.14em;color:#b99cff;font-weight:900;white-space:nowrap}
  .timebox input{flex:1;accent-color:#9b7bff;--acc:#9b7bff}
  /* time sliders: own track, so the fill goes all the way to the right at the maximum (--p is set from JS) */
  /* !important: the hero cards style every input like a text box, which would wipe out this track */
  .timebox input,.htime input,.ptime input{-webkit-appearance:none;appearance:none;height:8px!important;padding:0!important;border:0!important;border-radius:4px!important;margin:0;outline:none;cursor:pointer;
    background:linear-gradient(to right,var(--acc) 0 var(--p,50%),rgba(255,255,255,.2) var(--p,50%) 100%)!important}
  .timebox input::-webkit-slider-thumb,.htime input::-webkit-slider-thumb,.ptime input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:var(--acc);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  .timebox input::-moz-range-thumb,.htime input::-moz-range-thumb,.ptime input::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--acc);border:2px solid #fff}
  .timebox input:focus-visible,.htime input:focus-visible,.ptime input:focus-visible{box-shadow:0 0 0 3px rgba(255,255,255,.35)}
  .timebox output{min-width:44px;text-align:center;background:#231a52;border:2px solid #6e56d6;border-radius:10px;padding:2px 6px;font-weight:900}
  .heroes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(min-width:760px){.heroes{grid-template-columns:repeat(4,1fr)}}
  .hero{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:20px;padding:12px 10px;text-align:center;transition:opacity .2s,filter .2s}
  .hero.off{opacity:.45;filter:grayscale(.8)}
  .hero .tag{position:absolute;left:10px;top:10px;font-size:11px;font-weight:900;letter-spacing:.1em;background:#0a1830;border:1px solid var(--line);border-radius:8px;padding:3px 7px}
  .hero .x{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:9px;border:1px solid var(--line);background:#0a1830;color:#ff8fa0;font-weight:900}
  .ava{width:86px;height:86px;border-radius:50%;object-fit:cover;background:#0a1830;border:4px solid var(--ring,#fff);margin:26px auto 10px;display:block}
  .hero input{width:100%;background:#081a33;border:2px solid var(--line);border-radius:12px;color:var(--text);font:inherit;font-weight:900;text-align:center;padding:8px 6px;font-size:16px}
  .hero .ready{margin-top:8px;font-size:12px;color:var(--muted);font-weight:800}
  .cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin:18px 0 10px;padding:16px;border:0;border-radius:18px;background:linear-gradient(135deg,#ff6fd0,#8b5cff);font-size:20px;font-weight:900;box-shadow:0 8px 0 #4b2596,0 14px 30px rgba(139,92,255,.35);transition:transform .1s}
  .cta:active{transform:translateY(3px);box-shadow:0 5px 0 #4b2596}
  .link{display:block;margin:0 auto;background:none;border:0;color:var(--muted);text-decoration:underline;font-weight:800}
  .links{display:flex;justify-content:center;gap:22px;flex-wrap:wrap}
  .links .link{margin:0}
  #ixCount{opacity:.75}

  /* ---------- fish index ---------- */
  .card.wide{max-width:980px;max-height:92vh;display:flex;flex-direction:column}
  .ix-scroll{overflow:auto;min-height:0;flex:1;margin:4px -6px 0;padding:0 6px;text-align:left}
  .ix-h{font-weight:900;letter-spacing:.12em;text-transform:uppercase;font-size:13px;margin:14px 0 8px}
  .ix-h span{color:var(--muted);margin-left:6px}
  .ix-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
  .ix{background:#0a1830;border:2px solid color-mix(in srgb,var(--rc) 55%,transparent);border-radius:14px;padding:6px 8px 8px;text-align:center}
  .ix svg{width:100%;display:block}
  .ix-nm{font-weight:900;font-size:14px}
  .ix-n{font-size:11px;color:var(--muted);font-weight:800}
  .ix-n b{color:var(--text)}
  .ix.unk{border-color:#1c3558}
  .ix[data-f]{cursor:pointer;transition:transform .12s} .ix[data-f]:hover{transform:translateY(-2px)}
  .ix.unk svg{filter:brightness(0) opacity(.4)}
  .ix.unk ellipse{display:none}
  .ixnote .new{color:var(--gold)}

  /* ---------- game ---------- */
  .topbar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
  .pill{background:#fff;color:#1b2440;border:0;border-radius:999px;padding:7px 13px;font-weight:900;font-size:13px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
  .finish{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:-2px 0 10px;position:relative;z-index:25}
  .finish .pill{font-size:12px;padding:6px 11px}
  .pill.fin-no{background:var(--bad);color:#fff}
  .pill.fin-ok{background:var(--good);color:#04210f}
  @media(min-width:760px){.finish{position:fixed;top:12px;right:12px;margin:0;z-index:25}}
  .scene-wrap{position:relative;border-radius:22px;overflow:hidden;border:3px solid #2d6fb8;box-shadow:0 0 0 3px #0a1f3d,0 12px 40px rgba(0,0,0,.45);background:#0b2a4d}
  .scene-wrap svg.scene{display:block;width:100%;height:auto}
  /* painted level backgrounds (level 1 lake) */
  .photo{position:absolute;inset:0;width:100%;height:100%;display:none}
  .scene-wrap.photo-on .photo{display:block}
  .scene-wrap.photo-on #scene{visibility:hidden}
  .flash{position:fixed;inset:0;z-index:30;background:#fff;pointer-events:none;animation:flash .7s ease-out forwards}
  @keyframes flash{from{opacity:1}to{opacity:0}}

  /* full-screen painted levels: the painting fills the window, glass panels float over it */
  #game.immersive .scene-wrap{position:fixed;inset:0;height:100%;border:0;border-radius:0;box-shadow:none;z-index:0}
  #game.immersive > :not(.scene-wrap){position:relative;z-index:1}
  #game.immersive .finish{position:absolute}
  #game.immersive .pcard,#game.immersive .status,#game.immersive .pill:not(.fin-no):not(.fin-ok){background:rgba(8,18,36,.3);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1.5px solid rgba(255,255,255,.55);box-shadow:none;color:#fff}
  #game.immersive .pcard{border-color:var(--ring)}
  #game.immersive .word{background:rgba(8,18,36,.35);border-color:rgba(255,255,255,.4)}
  #game.immersive .word.right{background:var(--good)} #game.immersive .word.wrong{background:var(--bad)}
  #game.immersive .tbar{background:rgba(8,18,36,.4)}
  @media (max-width:999px){#game.immersive .hud{margin-top:46vh}}
  @media (min-width:1000px){
    #game.immersive{grid-template-rows:auto minmax(0,1fr) auto minmax(0,34vh)}
    #game.immersive .hud{grid-row:3} #game.immersive .players{grid-row:4}
  }

  /* catch scene: Gummy shows off the fish, players' scores on both sides */
  .catchscene{position:fixed;inset:0;z-index:25;background:#000;cursor:pointer;animation:csin .35s ease-out}
  @keyframes csin{from{opacity:.4}to{opacity:1}}
  .catchscene>svg{position:absolute;inset:0;width:100%;height:100%}
  .catchscene>.cs-vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
  .cs-side{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:2.6vh;width:min(30vw,500px);padding:0 2vw}
  .cs-side.l{left:0} .cs-side.r{right:0}
  .cs-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8vh;height:min(43vh,540px);padding:2vh 1.6vw;border-radius:3.4vh;border:1.5px solid var(--ring);background:rgba(8,18,36,.3);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;text-align:center;opacity:0;transform:translateY(18px) scale(.96);animation:csup .6s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes csup{to{opacity:1;transform:none}}
  /* score card: the player's own scene as a banner with their avatar, frosted glass below for the scores */
  .cs-card{justify-content:flex-start;gap:0;padding:0;overflow:hidden;border-width:2px;background:rgba(8,18,36,.28)}
  .cs-ban{flex:0 0 38%;min-height:0;position:relative;width:100%;background:var(--bg) center/cover no-repeat;border-bottom:2px solid var(--ring)}
  .cs-card .cs-ban img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:auto;height:80%;aspect-ratio:1;border-radius:50%;object-fit:cover;border:.4vh solid var(--ring);box-shadow:0 4px 16px rgba(0,0,0,.35);flex:none}
  .cs-body{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6vh;padding:1vh 1.6vw 1.6vh}
  .cs-card .cs-sc{font-size:7.5vh}
  /* entrance, all cards together: the banner + avatar pops in, then the card unrolls down to full size */
  .cs-card{transform:scale(.94);clip-path:inset(0 0 62% 0 round 3.4vh);animation:csban .26s .15s cubic-bezier(.2,.8,.3,1) forwards,csgrow .4s .38s cubic-bezier(.4,0,.2,1) forwards}
  @keyframes csban{to{opacity:1;transform:none}}
  @keyframes csgrow{to{clip-path:inset(0 0 0 0 round 3.4vh)}}
  .cs-body>*{opacity:0;animation:csbody .3s .5s ease-out forwards}
  @keyframes csbody{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  .cs-nm{font-weight:900;font-size:3.2vh;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 2px 8px rgba(0,0,0,.4)}
  .cs-sc{font-family:"Lilita One",Nunito,sans-serif;font-size:9vh;line-height:1;white-space:nowrap;text-shadow:0 3px 12px rgba(0,0,0,.45)}
  .cs-sc small{font-size:.42em;opacity:.75}
  .cs-rows{display:flex;flex-direction:column;gap:.5vh;width:min(100%,24vw);margin-top:.4vh}
  .cs-rows div{display:flex;justify-content:space-between;align-items:baseline;gap:1vw;padding:.5vh 1vw;border-radius:1.2vh;background:rgba(8,18,36,.3);font-size:2.4vh}
  .cs-rows span{font-weight:900;letter-spacing:.1em;text-transform:uppercase;opacity:.8;font-size:.85em}
  .cs-rows b{font-weight:900;white-space:nowrap}
  .cs-fish{position:absolute;left:0;right:0;bottom:2.4vh;margin:0 auto;width:fit-content;min-width:min(26vw,380px);padding:1.4vh 2.4vw;border-radius:2.6vh;border:1.5px solid var(--rc);background:rgba(8,18,36,.5);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;text-align:center;line-height:1.15;opacity:0;animation:csup .6s .15s cubic-bezier(.2,.8,.3,1) forwards}
  .cs-fname{font-family:"Lilita One",Nunito,sans-serif;font-size:5vh;text-shadow:0 3px 10px rgba(0,0,0,.45)}
  .cs-rar{font-weight:900;font-size:2.8vh;letter-spacing:.12em;text-transform:uppercase;color:var(--rc);text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .cs-rar.mythical{background:linear-gradient(90deg,#ff5f6d,#ffc371,#47e891,#3fa7ff,#b45cff,#ff5fd2);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rainbow 3s linear infinite}
  .cs-odds{font-weight:800;font-size:2.2vh;opacity:.85}
  .cs-kg{font-family:"Lilita One",Nunito,sans-serif;font-size:4vh;margin-top:.3vh}
  .ixd{position:absolute;right:3vw;top:50%;width:min(40vw,620px);max-height:90vh;overflow:auto;transform:translateY(-50%);padding:3.4vh 2.6vw;border-radius:3vh;border:1.5px solid var(--rc);background:rgba(8,18,36,.55);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:#fff;line-height:1.2;cursor:default;opacity:0;animation:ixdin .5s .1s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes ixdin{from{opacity:0;transform:translate(30px,-50%)}to{opacity:1;transform:translateY(-50%)}}
  .ixd-k{font-weight:900;letter-spacing:.14em;font-size:1.8vh;opacity:.7}
  .ixd-nm{font-family:"Lilita One",Nunito,sans-serif;font-size:6.4vh;line-height:1.05;margin:.8vh 0 .4vh;text-shadow:0 3px 10px rgba(0,0,0,.45)}
  .ixd .cs-rar{font-size:2.6vh}
  .ixd-rows{display:flex;flex-direction:column;gap:.8vh;margin:2.2vh 0}
  .ixd-rows div{display:flex;justify-content:space-between;align-items:baseline;gap:1.4vw;padding:1.1vh 1.4vw;border-radius:1.4vh;background:rgba(255,255,255,.08);font-size:2.3vh}
  .ixd-rows span{font-weight:900;letter-spacing:.1em;text-transform:uppercase;opacity:.75;font-size:.8em}
  .ixd-rows b{font-weight:900;text-align:right}
  .ixd-d{margin:0;font-size:2.4vh;font-weight:700;line-height:1.45;opacity:.92}
  @media (max-aspect-ratio:1/1){.ixd{left:3vw;right:3vw;top:auto;bottom:2vh;width:auto;max-height:52vh;transform:none;padding:2.2vh 4vw}@keyframes ixdin{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}.ixd-nm{font-size:4.4vh}.ixd-rows{margin:1.4vh 0}.ixd-rows div{font-size:1.9vh}.ixd-d{font-size:1.9vh}.ixview .cs-go{top:2vh;bottom:auto}}
  .cs-go{position:absolute;right:2.4vw;bottom:3vh;width:min(9vh,72px);height:min(9vh,72px);border-radius:50%;border:1.5px solid rgba(255,255,255,.7);background:rgba(8,18,36,.3);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;font-size:min(4vh,32px)}
  @media (max-width:700px){.cs-side{width:46vw;top:2vh;bottom:auto;gap:1.2vh;padding:0 2vw}.cs-card{height:auto;padding:0}.cs-ban{flex:none;height:9vh}.cs-body{padding:1vh 2vw}.cs-card .cs-sc{font-size:4.4vh}.cs-nm{font-size:2.2vh}.cs-sc{font-size:4.4vh}.cs-rows{width:100%}.cs-rows div{font-size:1.6vh}}
  @media (min-width:1000px){.plast{font-size:5.6vh;flex:1;align-content:center}}
  .status{margin:12px auto;text-align:center;background:#0c1d38;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px;max-width:560px}
  .meter{display:flex;gap:4px;justify-content:center;margin:8px 0 0}
  .meter i{width:14px;height:8px;border-radius:4px;background:#1c3558}
  .meter i.ok{background:var(--good)} .meter i.no{background:var(--bad)}
  .leap{position:absolute;top:0;left:0;width:26%;pointer-events:none;z-index:3;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}

  .players{display:grid;grid-template-columns:1fr;gap:10px}
  @media(min-width:760px){.players{grid-template-columns:repeat(var(--n),1fr)}}
  .pcard{background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:18px;padding:10px 12px;transition:border-color .2s,box-shadow .2s}
  .pcard.active{border-color:var(--ring);box-shadow:0 0 0 2px var(--ring),0 0 26px color-mix(in srgb,var(--ring) 45%,transparent)}
  .phead{display:flex;align-items:center;gap:10px}
  .phead img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:3px solid var(--ring);background:#0a1830;flex:none}
  .pname{font-weight:900;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pdots{display:flex;gap:4px}
  .pdots i{width:12px;height:12px;border-radius:50%;background:#1c3558;border:2px solid #2c4d78}
  .pdots i.ok{background:var(--good);border-color:#1f8f55} .pdots i.no{background:var(--bad);border-color:#a52b3b}
  .pwait{color:var(--muted);font-weight:800;font-size:13px;margin-left:auto}
  .pcard.active .pwait,.pcard.has-last .pwait{display:none}
  /* recap of the last answer on a waiting card */
  .plast{display:none;align-items:center;justify-content:center;flex-wrap:wrap;gap:.5em;font-weight:900;font-size:19px;padding:8px 0 2px}
  .pcard.has-last:not(.active) .plast{display:flex;animation:lastin .45s cubic-bezier(.2,.8,.3,1.2)}
  .plast.is-no{animation:lastin .45s cubic-bezier(.2,.8,.3,1.2),nudge .4s .1s ease-in-out}
  .plast .w{padding:.25em .6em;border-radius:.5em}
  .plast .w.ok{background:var(--good);color:#04210f}
  .plast .w.no{background:var(--bad);color:#fff;text-decoration:line-through;text-decoration-thickness:2px}
  .plast .arr{opacity:.8}
  @keyframes lastin{from{opacity:0;transform:scale(.8) translateY(6px)}to{opacity:1;transform:none}}
  @keyframes nudge{0%,100%{translate:0}25%{translate:-5px}50%{translate:5px}75%{translate:-3px}}
  /* smoother hand-off between players */
  .pcard{transition:border-color .3s,box-shadow .3s,transform .35s cubic-bezier(.2,.8,.3,1),opacity .3s}
  .pcard.active{transform:translateY(-4px)}
  /* slide the question's contents in, not .q itself: a transform on .q would make it the anchor of the
     absolutely-placed timer bar mid-animation and drop the bar onto the hint text */
  .pcard.active .q>:not(.tbar){animation:qin .35s ease-out}
  @keyframes qin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .confetto{position:fixed;z-index:40;width:7px;height:11px;border-radius:2px;pointer-events:none}
  .wpulse{position:fixed;z-index:40;border:3px solid var(--bad);border-radius:12px;pointer-events:none}
  .q{display:none;margin-top:10px}
  .pcard.active .q{display:block}
  .qhint{font-size:11px;letter-spacing:.14em;font-weight:900;color:#b99cff;margin-bottom:8px}
  .words{display:flex;flex-wrap:wrap;gap:7px}
  .word{border:2px solid #3a6aa8;background:#0a1d3a;border-radius:12px;padding:8px 11px;font-size:17px;font-weight:900;transition:transform .08s,background .15s}
  .word:active{transform:scale(.95)}
  .word.right{background:var(--good);border-color:#1f8f55;color:#04210f}
  .word.wrong{background:var(--bad);border-color:#a52b3b}
  .word.reveal{outline:3px dashed var(--good);outline-offset:2px}
  .word:disabled{cursor:default}
  /* sentence mode: three full-width sentence buttons */
  .words.sents{flex-direction:column;flex-wrap:nowrap}
  .word.sent{display:block;width:100%;text-align:left;line-height:1.25}
  /* Word / Sentence switch, top-left of the menu */
  .modesw{position:fixed;top:14px;left:14px;z-index:5;display:flex;padding:4px;gap:4px;border-radius:999px;background:rgba(8,18,36,.35);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1.5px solid rgba(255,255,255,.6)}
  .bankbtn{display:none!important;position:fixed;top:14px;right:14px;z-index:5;display:flex;align-items:center;gap:8px;padding:7px 16px 7px 10px;border-radius:999px;background:rgba(8,18,36,.35);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1.5px solid rgba(71,232,145,.9);color:var(--money);font-weight:900;font-size:17px;box-shadow:0 0 14px rgba(71,232,145,.25);transition:background .2s,transform .15s}
  .bankbtn:hover{background:rgba(8,18,36,.5);transform:translateY(-1px)}
  .bankbtn svg{width:24px;height:24px}

  #lobby .hero .tag,#lobby .hero .x{background:rgba(8,18,36,.35);border:1.5px solid rgba(255,255,255,.45);color:#fff}

  #lobby .cta{border-color:rgba(255,255,255,.85);text-shadow:0 2px 8px rgba(0,0,0,.35);transition:transform .15s,background .2s}

  /* ---------- final weigh-in on the scale painting ---------- */
  #weigh.weigh2{position:fixed;inset:0;display:block;padding:0;max-width:none;height:auto;overflow:hidden;background:#123}
  .wi-bg{position:absolute;inset:0;width:100%;height:100%}
  .glassy{background:rgba(8,18,36,.32);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1.5px solid rgba(255,255,255,.6);color:#fff}
  .wi-top,.wi-tab,.wi-btn{background:rgba(8,18,36,.32);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1.5px solid rgba(255,255,255,.6);color:#fff}
  .wi-top{position:absolute;top:2.4vh;left:0;right:0;margin:0 auto;width:fit-content;min-width:min(34vw,440px);padding:1.4vh 2.6vw;border-radius:2.6vh;text-align:center;line-height:1.1}
  .wi-kick{font-weight:900;letter-spacing:.16em;font-size:clamp(11px,1.9vh,18px);opacity:.85}

  .wi-rec{font-weight:800;font-size:clamp(11px,1.8vh,16px);opacity:.8;min-height:1.1em}
  .wi-tabs{position:absolute;left:0;right:0;bottom:11vh;display:flex;justify-content:center;gap:1.6vw;padding:0 2vw}
  .wi-tab{width:min(24vw,330px);padding:1.4vh 1.2vw 1.8vh;border-radius:2.6vh;border-color:var(--rc);text-align:center;line-height:1.15;opacity:0;transform:translateY(16px) scale(.96);transition:opacity .5s,transform .5s cubic-bezier(.2,.8,.3,1.2)}
  .wi-tab.in{opacity:1;transform:none}
  .wi-round{font-weight:900;letter-spacing:.14em;font-size:clamp(10px,1.6vh,15px);opacity:.75}
  .wi-art svg{width:min(70%,170px);display:block;margin:.4vh auto}

  .wi-rar{font-weight:900;letter-spacing:.12em;text-transform:uppercase;font-size:clamp(11px,2vh,19px);color:var(--rc);text-shadow:0 1px 6px rgba(0,0,0,.55)}
  .wi-rar.mythical{background:linear-gradient(90deg,#ff5f6d,#ffc371,#47e891,#3fa7ff,#b45cff,#ff5fd2);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rainbow 3s linear infinite}
  .wi-w{font-size:clamp(22px,4.6vh,44px);margin-top:.4vh;text-shadow:0 3px 10px rgba(0,0,0,.45)}
  .wi-btns{position:absolute;left:0;right:0;bottom:2.6vh;display:flex;justify-content:center;gap:1.2vw}
  /* review answers: one column per player, rounds as fold-out tabs */
  .review{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:rgba(6,14,30,.78);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:#fff;padding:2vh 1.6vw;animation:rvin .25s ease}

  .rv-cols{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:1.2vw}

  .rv-head span{font-weight:900;font-size:clamp(13px,2.1vh,20px);opacity:.85}

  .rv-rh{width:100%;display:flex;align-items:center;gap:.8vw;background:none;border:0;color:#fff;font:inherit;font-weight:900;font-size:clamp(14px,2.2vh,21px);padding:1vh .8vw;cursor:pointer;text-align:left}

  .rv-menu img{width:4.4vh;height:4.4vh;min-width:30px;min-height:30px;border-radius:50%;object-fit:cover;border:.3vh solid var(--ring)}
  .rv-menu .allic{width:4.4vh;height:4.4vh;min-width:30px;min-height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ff6fd0,#8b5cff);font-size:.8em}
  .wi-btn{font:inherit;font-weight:900;font-size:clamp(15px,2.6vh,24px);padding:1.3vh 2.6vw;border-radius:2vh;cursor:pointer;transition:background .2s,transform .15s}

  @media (max-width:700px){.wi-tabs{gap:6px;bottom:10vh}.wi-tab{width:31vw;padding:8px 6px}.wi-top{min-width:70vw}}

  /* ---------- leaderboard on the wooden sign ---------- */
  .board{position:fixed;inset:0;overflow:hidden;background:#3a2412}
  .brow{opacity:0;animation:brow .55s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes brow{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}

  /* ---------- round intro extras ---------- */
  .rchip.gold{border-color:#ffd36b;background:linear-gradient(90deg,rgba(255,197,61,.3),rgba(255,140,40,.3));color:#fff3c4}
  .rchip.day{border-color:#7fd3ff;background:rgba(127,211,255,.16);color:#c9ecff}
  .rchip.bait{border-color:#ff8fe0;background:rgba(255,143,224,.16);color:#ffd1f2}
  .rchip.big{border-color:#ffb020;background:linear-gradient(90deg,rgba(255,176,32,.28),rgba(255,95,210,.28));color:#fff3c4}
  .rchip.rod{border-color:#c4b5fd;background:rgba(196,181,253,.16);color:#e4dcff}
  .rtip{font-weight:800;opacity:.85;margin:8px 0 2px;font-size:clamp(13px,2vh,18px)}
  /* golden hour: the whole lake glows warm */
  #game.golden .scene-wrap::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 70% 0%,rgba(255,196,77,.38),rgba(255,140,40,.12) 60%,transparent);mix-blend-mode:screen;animation:goldpulse 3s ease-in-out infinite}
  @keyframes goldpulse{50%{opacity:.6}}
  /* answer streak */
  .pill.streak{background:linear-gradient(135deg,#ffb020,#ff5f6d);color:#fff}
  .pill.streak.bump{animation:bump .4s cubic-bezier(.2,1.6,.4,1)}
  @keyframes bump{40%{transform:scale(1.25)}}
  /* Gummy reacts on the painted lakes: a happy hop, or a yank toward the water */
  #breath{transform-box:fill-box;transform-origin:50% 100%}
  .photo.hop #breath{animation:ghop .6s cubic-bezier(.2,1.4,.4,1)}
  .photo.tug #cam{animation:gtug .55s ease-in-out}
  @keyframes ghop{35%{transform:translateY(-14px) scale(1.03)}}
  @keyframes gtug{20%{transform:translate(14px,6px) rotate(.6deg)}45%{transform:translate(-9px,-2px)}70%{transform:translate(5px,2px)}}
  #pbubble{transition:opacity .2s}

  /* ---------- the turn card: header, the lesson after an answer ---------- */
  .qhint{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .qrev{padding:2px 9px;border-radius:999px;background:rgba(255,176,32,.2);border:1px solid #ffb020;color:#ffd36b;letter-spacing:.04em}

  .say{margin-left:auto;display:grid;place-items:center;width:30px;height:30px;padding:5px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);background:rgba(8,18,36,.35);color:#fff;cursor:pointer}

  /* ---------- rarity reveal before the catch ---------- */
  .rreveal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:radial-gradient(circle at 50% 50%,rgba(8,18,36,.55),rgba(3,8,18,.92));pointer-events:none;animation:rvin .25s ease-out}
  @keyframes rvin{from{opacity:0}}
  .rreveal.out{opacity:0;transition:opacity .3s}
  .rv-q{grid-area:1/1;font-family:"Lilita One",Nunito,sans-serif;font-size:clamp(90px,22vh,220px);color:#fff;text-shadow:0 0 30px rgba(255,255,255,.6);animation:rvq .5s ease-in-out infinite alternate}
  @keyframes rvq{to{transform:scale(1.12) rotate(4deg)}}
  .rv-burst{grid-area:1/1;width:20vmin;height:20vmin;border-radius:50%;background:radial-gradient(circle,var(--rc) 0%,transparent 70%);opacity:0}
  .rv-label{grid-area:1/1;font-size:clamp(48px,12vh,130px);color:#fff;-webkit-text-stroke:3px rgba(0,0,0,.25);text-shadow:0 0 24px var(--rc),0 0 60px var(--rc);opacity:0;transform:scale(.4)}
  .rreveal.open .rv-q{display:none}
  .rreveal.open .rv-burst{animation:rvburst .9s ease-out forwards}
  .rreveal.open .rv-label{animation:rvlabel .55s cubic-bezier(.2,1.5,.4,1) forwards}
  @keyframes rvburst{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(9)}}
  @keyframes rvlabel{to{opacity:1;transform:none}}
  .rreveal.r-mythical.open{background:radial-gradient(circle,rgba(255,95,210,.35),rgba(3,8,18,.92) 70%)}
  .rreveal.r-mythical .rv-label{background:linear-gradient(90deg,#ff5f6d,#ffc371,#47e891,#3fa7ff,#b45cff,#ff5fd2);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:0;filter:drop-shadow(0 0 18px rgba(255,95,210,.8))}
  .rreveal.r-legendary.open{background:radial-gradient(circle,rgba(255,176,32,.3),rgba(3,8,18,.92) 70%)}

  /* ---------- catch scene: why this fish ---------- */

  /* ---------- tackle shop ---------- */

  .sh-ic.rod{width:100%;height:84px;display:grid;place-items:center} .sh-ic.rod img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}

  .sh-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}

  .sh-use{border-color:#ff8fe0;background:rgba(255,143,224,.12);color:#ffd1f2}
  .sh-use.on{background:linear-gradient(135deg,#ff6fd0,#8b5cff);color:#fff;border-color:#fff}
  .sh-tag{font-weight:900;font-size:13px;padding:6px 12px;border-radius:12px;border:1.5px solid rgba(255,255,255,.4);opacity:.8}

  /* ---------- how to play: four steps ---------- */
  .how-steps{display:grid;gap:1.4vh;align-content:center;height:100%}
  .how-step{display:flex;gap:1.2vw;align-items:center;text-align:left}
  .hs-ic{flex:none;display:grid;place-items:center;width:clamp(40px,6.5vh,64px);height:clamp(40px,6.5vh,64px);border-radius:50%;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.45);font-size:clamp(20px,3.4vh,34px)}

  /* ---------- classroom version: big, readable question area; works on 4:3 projectors ---------- */
  .lb-seg button{width:auto;padding:0 14px;gap:7px;display:flex;align-items:center}
  .seg-t{font-weight:900;font-size:15px;letter-spacing:.02em}

  .lobbar .seg-t{font-size:clamp(12px,1.3cqw,20px)}
  @media (min-width:1000px){
    #game.immersive{grid-template-rows:auto minmax(0,1fr) auto minmax(0,52vh)!important}

    #game.immersive .players{gap:.8vw}

  @media (max-width:999px) and (min-width:700px) and (max-aspect-ratio:3/2){

    .pcard{min-width:0;padding:8px 10px}
    .pcard .pwait,.pcard:not(.active) .plast{display:none!important}
    .pcard.active{grid-column:1/-1;order:2}

  }
  /* ================= MOBILE: one player, phone held upright ================= */

  /* the one player card: picture left, name right; tap it to change character */
  #lobby .heroes{display:block}

  #lobby .hero.solo1 .tag{position:static;font-size:11px}
  #lobby .hero.solo1 .nm{font-size:24px;padding:0;border:0;background:none;max-width:100%}
  #lobby .hero.solo1 .ready{margin:0;font-size:13px}
  #lobby .cta{margin:16px 0 12px;font-size:22px;padding:17px}
  #lobby .links{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  #lobby .link{justify-content:center;font-size:16px;padding:10px 12px 10px 10px;gap:10px}
  #lobby .lico{width:38px;height:38px;border-radius:11px}
  #lobby .lico svg{width:22px;height:22px}
  /* menu like the mockup: the picture up top, the buttons low; only Foxino plays, so no player card */
  #lobby,#lobby.fit{display:flex;flex-direction:column;justify-content:flex-end;min-height:100vh;min-height:100dvh;padding-bottom:calc(5vh + env(safe-area-inset-bottom))}
  #lobby .tagline,#lobby .heroes{display:none!important}
  #lobby .setbtn small{display:none}

  #lobby .setbtn b{font-size:18px}
  #lobby .ixtop{left:auto;right:12px}
  #lobby .ixtop svg{width:30px;height:26px}
  /* How to play (top right): just the book icon in a circle */
  #lobby #howTop{width:var(--hbtn,52px);height:var(--hbtn,52px);padding:0;border-radius:50%;justify-content:center;gap:0}
  #lobby #howTop span{display:none}
  #lobby #howTop svg{width:26px;height:26px}
  /* Settings (top left): just the gear icon in a circle, like How to play */
  #lobby #setBtn{width:52px;height:52px;padding:0;border-radius:50%;justify-content:center;gap:0}
  #lobby #setBtn span{display:none}
  #lobby #setBtn svg{width:26px;height:26px}
  #lobby .cta{margin:0 0 14px;font-size:26px;padding:22px 17px;border-radius:24px}
  #lobby .link{padding:12px 12px 12px 10px;border-radius:22px;font-size:17px}
  /* game: the picture fills the phone, the question sits at the bottom where the thumb is */
  #game{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
  #game .topbar{gap:6px;margin-bottom:6px}
  #game .pill{font-size:14px;padding:8px 14px}
  #game.immersive .hud{margin-top:auto}
  #game .status{font-size:15px}
  #game .players{display:block;margin-top:8px}
  #game .pcard{padding:14px;border-radius:22px}
  #game .pname{font-size:18px}
  #game .phead img{width:40px;height:40px}
  #game .words{gap:8px}
  #game .q{font-size:21px}
  #game .words{font-size:1em}
  #game .word{font-size:1em;padding:.5em .65em;border-radius:16px;min-height:2.3em}
  #game .fsent{font-size:1em}
  #game .plast{font-size:20px}
  /* catch scene: fish name at the top, your round card at the bottom, big continue button */
  .catchscene .cs-side.r{display:none}

  .catchscene .cs-card{position:relative;flex-direction:row;align-items:stretch;height:auto;border-radius:22px;clip-path:none;animation:csup .5s .1s cubic-bezier(.2,.8,.3,1) forwards}
  .catchscene .cs-ban{flex:0 0 96px;height:auto;border-bottom:0;border-right:2px solid var(--ring)}
  .catchscene .cs-card .cs-ban img{height:auto;width:68px;border-width:3px}
  .catchscene .cs-body{align-items:stretch;padding:12px 14px;gap:6px}

  .catchscene .cs-nm{font-size:18px;text-align:left}
  .catchscene .cs-card .cs-sc{position:absolute;right:14px;top:10px;font-size:34px}
  .catchscene .cs-rows{width:100%;gap:4px}
  .catchscene .cs-rows div{font-size:14px;padding:5px 10px;border-radius:10px}
  .catchscene .cs-catch{margin-top:2px}
  .catchscene .cs-catch svg{width:44px}
  .catchscene .cs-catch b{font-size:15px}
  .catchscene .cs-catch span{font-size:14px}
  .catchscene .cs-best{top:calc(16px + env(safe-area-inset-top));bottom:auto;min-width:0;max-width:calc(100% - 24px);padding:10px 18px;border-radius:18px}
  .catchscene .cs-best .cs-bk{font-size:11px}
  .catchscene .cs-best b{font-size:24px}
  .catchscene .cs-best .cs-by{display:none}
  .catchscene .cs-go{left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));width:auto;height:64px;border-radius:20px;font-size:28px}
  .catchscene .cs-go::before{content:"Continue ";font:900 20px Nunito,sans-serif;vertical-align:middle}

  .ixview .cs-go{left:auto;width:52px;height:52px;border-radius:50%;font-size:22px}
  /* weigh-in: total and your record on top, your 3 fish in a row, three buttons at the bottom */
  #weigh .wi-top{top:calc(14px + env(safe-area-inset-top));min-width:0;width:calc(100% - 24px);padding:12px 16px;border-radius:20px}
  #weigh .wi-kg{font-size:44px}

  #weigh .wi-round{font-size:11px}

  #weigh .wi-w{font-size:22px}
  #weigh .wi-btns{left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));gap:8px}
  #weigh .wi-btn{flex:1;font-size:16px;padding:16px 6px;border-radius:18px}

  .ov .card.howm{text-align:left;max-height:92vh;overflow:auto}

  .howm .h{margin:2px 0 12px}

  .howm li::marker{font-weight:900;color:#ff8fe0}
  .review .rv-top h2{font-size:24px}
  /* rarities: the chances in How to play, the price on the catch screen, the label on the weigh-in */
  .how-rarm{margin-top:14px;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.07)}
  .how-rarm .kicker{text-align:left;margin-bottom:6px}
  .hr-row{display:flex;justify-content:space-between;padding:4px 2px;font-size:15px}

  #weigh .wi-rar{display:block;font-size:10px;letter-spacing:.08em}
  /* bank + shop + how to play: three buttons in the lobby */
  #lobby .links{grid-template-columns:repeat(3,1fr);gap:8px}

  .bk-prog{flex-direction:column;align-items:stretch;gap:10px;margin:10px 0 8px}

    padding:calc(18px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
    background:rgba(8,18,36,.88);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}

  .rbanner{position:fixed;left:12px;right:12px;top:calc(64px + env(safe-area-inset-top));z-index:40;padding:12px 16px;border-radius:20px;text-align:center;color:#fff;pointer-events:none;
    background:rgba(8,18,36,.45);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1.5px solid rgba(255,255,255,.6);animation:rbin .35s cubic-bezier(.2,.8,.3,1);transition:opacity .4s,transform .4s}

  .pj-avs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}

  .pj-avs img{width:100%;height:100%;object-fit:cover;display:block}

  .pj-me{font-size:22px;font-weight:900;margin-top:4px}

  .pj-words{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
  .pj-words button{padding:14px 16px;min-width:70px;border-radius:16px;border:2px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));color:#fff;font-weight:900;font-size:20px;box-shadow:0 5px 0 #081a33}

  .pj-words button:disabled:not(.picked){opacity:.45}
  .pj-time{height:12px;border-radius:99px;background:#122039;border:2px solid #586b8f;overflow:hidden}

  .pj-left{font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .pj-mark{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:52px;font-weight:900;color:#fff;margin-bottom:4px}

// sentence mode: the misspelled sentence + two other sentences written correctly, in random order
const plain = (s) => s.replace(/\[([^|\]]+)\|([^\]]+)\]/g, '$2');
function sentenceChoices(s) {
  const m = s.match(/\[([^|\]]+)\|([^\]]+)\]/);
  const bad = {text: s.replace(/\[([^|\]]+)\|([^\]]+)\]/, '$1'), wrong: true, bad: m[1], fix: m[2]};
  const others = shuffle(QS[G.level].filter((o) => o !== s)).slice(0, 2).map((o) => ({text: plain(o), wrong: false}));
  return shuffle([bad, ...others]);
}
function parseSentence(s) {
  const re = /\[([^|\]]+)\|([^\]]+)\]([^\s]*)|\S+/g;
  const out = []; let m;
  while ((m = re.exec(s))) {
    if (m[1] !== undefined) out.push({text: m[1] + m[3], wrong: true, fix: m[2] + m[3], bad: m[1]});
    else out.push({text: m[0], wrong: false});
  }
  return out;
}

// the full sentence written correctly (word / sentence mode: [wrong|right]; fill mode: [right|wrong|wrong])
const fixed = (s) => s.replace(/\[([^|\]]+)\|([^|\]]+)\|([^\]]+)\]/g, '$1').replace(/\[([^|\]]+)\|([^\]]+)\]/g, '$2');

// o = {luck: rod bonus, bait: bait id}
function rarityWeights(o) {
  const w = {};
  for (const k in RARITY) w[k] = RARITY[k].odds;
  ['epic', 'legendary', 'mythical'].forEach((k) => (w[k] *= 1 + (o.luck || 0)));
  if (o.bait === 'golden') w.legendary *= 3;
  if (o.bait === 'star') w.mythical *= 4;
  if (o.bait === 'spinner') w.common = 0;
  return w;
}
const oddsOf = (w, k) => w[k] / Object.values(w).reduce((a, b) => a + b, 0) * 100;
function rollRarity(w) {
  let r = Math.random() * Object.values(w).reduce((a, b) => a + b, 0);
  for (const [k, v] of Object.entries(w)) { if (r < v) return k; r -= v; }
  return 'rare';
}

    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch {}
}

    const len = actx.sampleRate * .35, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    f.type = 'lowpass'; f.frequency.value = 1400; g.gain.value = .35;

}
// a soft plucked note (marimba-ish): quick attack, gentle decay, a quiet octave on top
function pluck(freq, dur = .5, vol = .12, delay = 0) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + delay, g = actx.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    g.connect(actx.destination);

      const o = actx.createOscillator(), og = actx.createGain(); o.type = type; o.frequency.value = freq * m; og.gain.value = v;

async function answer(pi, words, idx, q) {
  G.busy = true; cancelAnimationFrame(G.timer);
  const me = G, {sentence} = G.cur;
  const ok = idx >= 0 && words[idx].wrong;
  // keep what was asked and what was tapped, for "Review answers" after the game
  const entry = {mode: G.mode, pick: idx, ok, items: words.map((x) => ({text: x.text, target: !!x.wrong, fix: x.fix}))};
  if (G.mode === 'fill') { entry.before = words.sentence.before; entry.after = words.sentence.after; }
  entry.lesson = ruleHtml(sentence); // shown in Review answers after the game
  G.players[pi].log[G.level].push(entry);
  const btns = q.querySelectorAll('.word');
  btns.forEach((b) => (b.disabled = true));
  const wi = words.findIndex((w) => w.wrong);
  if (ok) btns[idx].classList.add('right');
  else { if (idx >= 0) btns[idx].classList.add('wrong'); btns[wi].classList.add('reveal'); }
  const w = words[wi], fm = G.mode === 'fill';
  if (fm) { // fill the gap with the right word
    const gap = q.querySelector('.fsent .gap'); if (gap) { gap.textContent = w.text; gap.classList.add('done'); }
    w.fix = w.text; w.bad = idx >= 0 && !ok ? words[idx].text : '?';
  }
  const p = G.players[pi];
  p.results[G.level].push(ok);
  // speed: 1 = instant, 0 = ran out of time (scored out of 10 on the catch screen)
  const limit = G.turnSecs || answerTime;
  const secs = Math.min(limit, (performance.now() - G.turnStart) / 1000);
  p.speed[G.level].push(idx < 0 ? 0 : clamp(1 - secs / limit, 0, 1));
  p.times[G.level].push(secs);
  G.turnResults.push(ok);
  const st = G.levelStats[G.level]; st.t++; if (ok) st.c++;
  G.streak = ok ? G.streak + 1 : 0; G.bestStreak[G.level] = Math.max(G.bestStreak[G.level], G.streak); renderStreak();
  // this answer's kilos for the fish: team = the team's streak, solo = the player's own streak
  p.streak = ok ? p.streak + 1 : 0;
  p.kgs[G.level].push(answerKg(ok, p.speed[G.level][p.speed[G.level].length - 1], G.play === 'solo' ? p.streak : G.streak));
  // fish depth: more right answers bring it closer to the surface
  const n = G.turns.length, wrong = st.t - st.c;
  sc.tFishY = clamp(222 - (st.c / n) * 90 + wrong * 6, 132, 228);
  const at = idx >= 0 ? btns[idx].getBoundingClientRect() : null;
  if (ok) { sfx.right(G.streak); confetti(at, p.ring); }
  else { sfx.wrong(); if (at) wrongPulse(at); }
  const photo = LEVELS[G.level].photo; // painted levels: Gummy just keeps breathing, no reel/tug
  if (!photo) setMood(ok ? 'reel' : 'tug');
  // the player's card keeps a one-line recap while everyone else plays on
  p.last = ok ? `<span class="w ok">${esc(G.mode === 'sentence' || fm ? w.fix : words[idx].text)}</span>`
    : `<span class="w no">${esc(w.bad)}</span><span class="arr">&rarr;</span><span class="w ok">${esc(w.fix)}</span>`;
  const card = $('pc' + pi);
  const dots = card.querySelectorAll('.pdots i');
  const k = p.results[G.level].length - 1; if (dots[k]) dots[k].className = ok ? 'ok' : 'no';
  const last = card.querySelector('.plast'); last.innerHTML = p.last;
  last.className = 'plast ' + (ok ? 'is-ok' : 'is-no');
  card.classList.add('has-last');
  G.turn++; renderMeter(); updateScore();
  await untilResumed();
  if (G !== me) return;
  nextTurn();
}

// what a catch sells for: rarity price × size (lightest of its kind 1×, heaviest 1.5×)
// × round (1× / 1.5× / 2×) × team answers that round (all wrong 0.75×, all right 1.25×)
function fishValue(f, kg, lv, acc) {
  const size = f[3] > f[2] ? clamp((kg - f[2]) / (f[3] - f[2]), 0, 1) : 0;
  return Math.round(RARITY[f[1]].pay * (1 + size * .5) * LEVELS[lv].mult * (.75 + acc * .5));
}
// a fish not in the Fish Index yet is this many times more likely than one you already have (same rarity)
const NEW_FISH_BOOST = 3;
// after this many games in a row without a Legendary or Mythical, the next game has one for sure
const BIG_FISH_AFTER = 4;
let bigPity = store.get('gummyBigPity', 0); // games in a row without a Legendary / Mythical
// one catch: every fish has the same chance, but a fish already in the Fish Index can't bite again
// (once the whole Fish Index is caught, any fish can come again); returns {f: fish}
// one catch: the rarity is rolled by its chance (the rod and bait from the shop raise the rare ones),
// then a fish of that rarity (one you don't have yet bites more often); o.big = must be Legendary or Mythical
function catchFish(o = {}) {
  const w = rarityWeights(o);
  const r = o.big ? rollRarity({legendary: w.legendary, mythical: w.mythical}) : rollRarity(w);
  const pool = FISH.filter((f) => f[1] === r);
  const ws = pool.map((f) => (fishIndex[f[0]] ? 1 : NEW_FISH_BOOST));
  let x = Math.random() * ws.reduce((a, b) => a + b, 0), k = 0;
  while (k < pool.length - 1 && x >= ws[k]) x -= ws[k++];
  return {f: pool[k]};
}
// chance in % for every rarity with the rod you own (and an optional bait), e.g. {common: 60, …}
const chances = (o = {luck: rodNow().luck}) => { const w = rarityWeights(o); return Object.fromEntries(Object.keys(RARITY).map((k) => [k, oddsOf(w, k)])); };
const fmtPct = (p) => (p >= 10 ? Math.round(p) : p >= 1 ? +p.toFixed(1) : +p.toPrecision(2)) + '%';
// fish weight from the answers: a right answer adds .3–1 kg (faster = more), a wrong one adds nothing.
// Right answers in a row (across the whole game) make each one count more: 2nd ×1.25, 3rd ×1.5 … up to ×3.5
const KG_PER_ANSWER = [.3, 1];
const streakMult = (run) => 1 + .25 * clamp(run - 1, 0, 10);
const answerKg = (ok, speed, run) => (ok ? (KG_PER_ANSWER[0] + (KG_PER_ANSWER[1] - KG_PER_ANSWER[0]) * speed) * streakMult(run) : 0);
const isBig = (f) => f[1] === 'legendary' || f[1] === 'mythical';
const pickFish = (o = {}) => catchFish(o).f;

// rolls this round's fish and adds them to the catches + fish index.
// Team: one fish from the team's answers, credited to every player. Solo: one fish per player from their own answers.
function catchRound(lv) {
  G.landed[lv] = true;
  if (!dev) { stats.rounds++; store.set('gummyStats', stats); }
  const roll = (acc, c, t, pi, ids, kgs) => {
    // the guaranteed big fish: the last round, if no Legendary / Mythical came earlier this game
    const force = G.bigDue && !G.gotBig && lv === LEVELS.length - 1;
    const {f} = catchFish({luck: G.rod.luck, bait: G.bait, big: force});
    if (isBig(f)) G.gotBig = true;
    // the weight comes from the answers that caught it (at least 0.1 kg, even if every answer was wrong)
    const kg = Math.max(.1, Math.round(kgs.reduce((a, b) => a + b, 0) * 100) / 100);
    // answer streak bonus on top of the price
    const bonus = []; let mult = 1;
    const sb = 1 + .03 * Math.min(G.bestStreak[lv], 8);
    if (sb > 1) { mult *= sb; bonus.push(`Streak &times;${+sb.toFixed(2)}`); }
    const ct = {fish: f, level: lv, acc, c, t, kg, usd: Math.round(fishValue(f, kg, lv, acc) * mult), pi, bonus};
    ct.before = recordCatch(f, kg, ids);
    G.catches.push(ct);
    return ct;
  };
  if (G.play !== 'solo') {
    const st = G.levelStats[lv];
    return [roll(st.t ? st.c / st.t : 0, st.c, st.t, -1, G.players.map((p) => p.charId), G.players.flatMap((p) => p.kgs[lv]))];
  }
  return G.players.map((p, pi) => {
    const r = p.results[lv], c = r.filter(Boolean).length;
    return roll(r.length ? c / r.length : 0, c, r.length, pi, [p.charId], p.kgs[lv]);
  });
}

// mobile: no "?" rarity reveal before the catch; the catch screen shows the rarity straight away
const bestOf = (round) => round.reduce((b, c) => (c.usd > b.usd ? c : b)); // most valuable fish of the round

// "Finish" buttons: every unanswered turn this round counts as right (ok) or wrong,
// then straight to Gummy showing off the catch; the game carries on with the next round
async function finishGame(ok) {
  if (!G || G.done || G.finishing) return;
  const lv = G.level;
  if (G.landed[lv]) return; // this round's fish is already being landed
  G.finishing = true; G.busy = true; cancelAnimationFrame(G.timer);
  G.paused = false; resumeWaiters.splice(0).forEach((f) => f());
  const st = G.levelStats[lv], turnsPerLevel = G.players.length * ANSWERS;
  while (st.t < turnsPerLevel) { st.t++; if (ok) st.c++; }
  G.players.forEach((p) => {
    while (p.results[lv].length < ANSWERS) { p.log[lv].push({skipped: true, ok}); p.results[lv].push(ok); p.speed[lv].push(ok ? .8 : 0); p.times[lv].push(ok ? answerTime * .2 : answerTime); }
  });
  $('ov').hidden = true; $('ov').innerHTML = '';
  document.querySelectorAll('.leap').forEach((e) => e.remove());
  setMood('idle'); sc.zoom = sc.tZoom = 1;
  const round = catchRound(lv), me = G;
  await showCatchScene(bestOf(round), lv, round);
  if (!G || G.done) return;
  G.finishing = false; sc.tFishY = 222;
  if (lv === LEVELS.length - 1) showWeighIn(); else beginLevel(lv + 1);
}
$('finishOk').addEventListener('click', () => { if (devMode) finishGame(true); });
$('finishNo').addEventListener('click', () => { if (devMode) finishGame(false); });

async function landFish() {
  if (G.done) return;
  document.querySelectorAll('.pcard').forEach((c) => c.classList.remove('active'));
  const lv = G.level;
  const round = catchRound(lv), shown = bestOf(round); // solo: Gummy holds up the round's best catch
  const f = shown.fish, st = G.levelStats[lv], before = shown.before;
  if (LEVELS[lv].photo || G.play === 'solo') {
    // Gummy yanks the rod while the camera pushes in — and right at that moment, cut to the catch
    setStatus('Gummy pulls with all his might…');
    setMood('reel'); clearTimeout(moodTimer); sc.tLean = -24; sc.shake = 1; sc.tZoom = 1.35; G.yank = true;
    await wait(1000);
    if (G) G.yank = false;
    if (!G || G.done) return;
    const me = G;
    setMood('idle'); sc.zoom = sc.tZoom = 1;
    if (G !== me) return;
    const fl = document.createElement('div'); fl.className = 'flash'; document.body.appendChild(fl);
    setTimeout(() => fl.remove(), 800);
    await showCatchScene(shown, lv, round);
    if (!G || G.done) return;
    sc.tFishY = 222;
    if (lv === LEVELS.length - 1) showWeighIn(); else beginLevel(lv + 1);
    return;
  }
  setStatus('Gummy pulls with all his might…');
  sc.tFishY = 124; setMood('reel'); sc.tBend = 1.4; clearTimeout(moodTimer);
  await wait(1100);
  if (!G || G.done) return;
  sfx.catch(); sc.splashT = 1;
  $('shadow').style.opacity = 0; $('deepLine').style.opacity = 0;
  // fish leaps out of the water into Gummy's hands
  const wrap = $('sceneWrap');
  const el = document.createElement('div'); el.className = 'leap'; el.innerHTML = fishSVG(f);
  wrap.appendChild(el);
  const toPx = (x, y) => { const svg = $('scene'), pt = svg.createSVGPoint(); pt.x = x; pt.y = y; const q = pt.matrixTransform(svg.getScreenCTM()), r = wrap.getBoundingClientRect(); return [q.x - r.left, q.y - r.top]; };
  const unit = toPx(100, 0)[0] - toPx(0, 0)[0];
  const fw = unit * 1.05; el.style.width = fw + 'px';
  const b = toPx(BOBX, 118), h = toPx(98, 40);
  const from = [b[0] - fw / 2, b[1] - fw * .25], to = [h[0] - fw / 2, h[1] - fw * .2];
  el.animate([
    {transform: `translate(${from[0]}px, ${from[1]}px) rotate(20deg) scale(.4)`},
    {transform: `translate(${(from[0] + to[0]) / 2}px, ${Math.min(from[1], to[1]) - fw * .6}px) rotate(-200deg) scale(1)`, offset: .55},
    {transform: `translate(${to[0]}px, ${to[1]}px) rotate(-360deg) scale(.9)`},
  ], {duration: 1300, easing: 'cubic-bezier(.3,.6,.4,1)', fill: 'forwards'});
  setMood('idle'); sc.tLean = -6;
  await wait(1500);
  el.remove();
  if (!G || G.done) return;
  setMood('idle');
  return showCatch(f, st, before, lv);
}

// full-screen "look what I caught": Gummy holds up the hook with the fish on it, player scores on both sides
const CATCH_ART = {src: 'art/gummy-catch.webp', w: 1672, h: 941, focus: [800, 470], hook: [630, 341],
  // fish index close-up: a softly blurred, higher-res picture of this part of the photo (photo units)
  index: {src: 'art/gummy-index.webp', x: 316.5, y: 115, w: 950, h: 665, hook: [630, 346]}};
// where a fish's mouth is, in fishSVG viewBox units (-8 -6 216 112): painted fish are measured from
// their picture (frontmost solid pixels of the snout), drawn fish use their fixed shape
const mouthCache = {};
function measureMouth(src) {
  if (mouthCache[src]) return mouthCache[src];
  return mouthCache[src] = new Promise((res) => {
    const im = new Image();
    im.onload = () => {
      const w = 240, h = Math.max(1, Math.round(w * im.naturalHeight / im.naturalWidth));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d'); g.drawImage(im, 0, 0, w, h);
      let a; try { a = g.getImageData(0, 0, w, h).data; } catch { return res(null); }
      // snout = rightmost column with a solid chunk of fish in it (ignores thin whiskers and fin tips)
      const solid = (x) => { let n = 0, sy = 0; for (let y = 0; y < h; y++) if (a[(y * w + x) * 4 + 3] > 140) { n++; sy += y; } return [n, sy]; };
      let sx = -1, n = 0, sy = 0;
      for (let x = w - 1; x >= 0; x--) { [n, sy] = solid(x); if (n >= h * .13) { sx = x; break; } }
      if (sx < 0) return res(null);
      res({fx: sx / w, fy: Math.min(1, sy / n / h + .05), ar: im.naturalWidth / im.naturalHeight});
    };
    im.onerror = () => res(null);
    im.src = src;
  });
}
// drawn fish: [front edge x, mouth x, mouth y] in fishSVG units, matching each shape's mouth path
const DRAWN_MOUTH = {std: [178, 165, 53], long: [184, 165, 53], round: [176, 165, 53], sword: [178, 165, 53], eel: [190, 181, 55], shark: [183, 168, 59], hammer: [182, 168, 59], ray: [190, 125, 57], angler: [179, 170, 58]};
// returns [snout tip, mouth]: the fish hangs from the snout tip, the line runs on over the fish to the mouth
async function fishMouth(f) {
  if (f[4] !== 'img') { const [tx, mx, my] = DRAWN_MOUTH[f[4]] || DRAWN_MOUTH.std; return [[tx, my], [mx, my]]; }
  const m = await measureMouth(f[5]);
  if (!m) return [[196, 54], [196, 54]];
  const sc = Math.min(192 / m.ar, 92), dw = sc * m.ar, dh = sc; // image is fit ("meet") into the 192×92 box at (4,4)
  const at = ([fx, fy]) => [4 + (192 - dw) / 2 + fx * dw, 4 + (92 - dh) / 2 + fy * dh];
  const tip = at([m.fx, m.fy]);
  if (!f[6]) return [tip, tip];
  const mouth = at(f[6]);
  return [[tip[0], mouth[1]], mouth]; // hang from the front edge level with the mouth, so the line drops straight onto it
}

// a player's score for one round, out of 10: each answer is worth 5 — 3 for being right + up to 2 for speed
function roundScore(p, lv) {
  const n = p.results[lv].length; if (!n) return 0;
  const pts = p.results[lv].reduce((a, ok, k) => a + (ok ? 3 + 2 * (p.speed[lv][k] || 0) : 0), 0);
  return Math.round(pts / (n * 5) * 10);
}

// Gummy holding fish f up on the hook, as an <svg> cropped to fill the screen
// close = zoom in on Gummy and the fish, keeping them in the left part of the screen (fish index view)
async function catchPhoto(f, art, close) {
  if (!close) return foxCatchPhoto(f);
  const A = CATCH_ART;
  const vw = innerWidth, vh = innerHeight, ar = vw / vh;
  let w = A.w, h = w / ar;
  if (h > A.h) { h = A.h; w = h * ar; }
  // upright phone: aim a little left of Gummy, so the fish on the hook stays in the picture too
  const fx = ar < 1 ? 760 : A.focus[0];
  let x = clamp(fx - w / 2, 0, A.w - w), y = clamp(A.focus[1] - h / 2, 0, A.h - h);
  const I = A.index; // close-up picture covers only this part of the photo, so the camera stays inside it
  if (close) {
    w = I.w; h = w / ar; if (h > I.h) { h = I.h; w = h * ar; }
    x = clamp(I.hook[0] - w * (ar > 1 ? .33 : .5), I.x, I.x + I.w - w); y = clamp(I.hook[1] - h * .34, I.y, I.y + I.h - h);
  }
  // fish hangs head-up from the hook by its mouth; rarer fish hang bigger
  const L = 280 + 35 * Object.keys(RARITY).indexOf(f[1]), H = L * 112 / 216;
  const [hx, hy] = close ? I.hook : A.hook;
  const [[mx, my], [ox, oy]] = await fishMouth(f); // snout pinned onto the end of the line, head up
  const px = (mx + 8) / 216 * L, py = (my + 6) / 112 * H;
  // fish is turned head-up, so a point further back on the fish sits lower: draw the line down over it to the mouth
  const lx = hx + (oy + 6) / 112 * H - py, ly = hy - ((ox + 8) / 216 * L - px);
  // a chain (art/chain.webp repeated link under link; the index close-up uses a copy colour-matched to its line) runs straight down from the line's end to the mouth
  const cw = 7, ch = cw * 170 / 72, cy = hy - 4, len = ly - cy, cid = 'ch' + (++fishUid);
  const line = len > 2 ? `<defs><pattern id="${cid}" patternUnits="userSpaceOnUse" x="${hx - cw / 2}" y="${cy}" width="${cw}" height="${ch.toFixed(2)}"><image href="${close ? 'art/chain-index.webp' : 'art/chain.webp'}" width="${cw}" height="${ch.toFixed(2)}" preserveAspectRatio="none"/></pattern>
    <filter id="${cid}b" x="-50%" y="-10%" width="200%" height="120%"><feGaussianBlur stdDeviation="${close ? .9 : 0}"/></filter></defs>
    <rect x="${hx - cw / 2}" y="${cy}" width="${cw}" height="${len.toFixed(1)}" fill="url(#${cid})" filter="url(#${cid}b)"/>` : '';
  const swing = close ? '' : `<animateTransform attributeName="transform" type="rotate" values="-5 ${hx} ${hy - 30};5 ${hx} ${hy - 30};-5 ${hx} ${hy - 30}" dur="2.6s" repeatCount="indefinite"/>`;
  const fish = `<g>${swing}
    <g transform="translate(${hx} ${hy}) rotate(-90) translate(${(-px).toFixed(1)} ${(-py).toFixed(1)})">${fishSVG(f, `width="${L}" height="${H.toFixed(1)}"`)}</g>${line}</g>`;
  return `<svg viewBox="${x.toFixed(1)} ${y.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      ${close
        ? `<image href="${I.src}" x="${I.x}" y="${I.y}" width="${I.w}" height="${I.h}" preserveAspectRatio="none"/>`
        : `<image href="${art || A.src}" width="${A.w}" height="${A.h}"/>`}${fish}</svg>`;
}

async function foxCatchPhoto(f) {

  const L = A.fishLen + 15 * Object.keys(RARITY).indexOf(f[1]), H = L * 112 / 216; // rarer fish hang a bit bigger
  const [, [ox, oy]] = await fishMouth(f);
  const mx = (ox + 8) / 216 * L, my = (oy + 6) / 112 * H; // the mouth, in the fish picture
  // the video and the drawing on top are both cropped to the phone the same way (centred cover), so they line up
  return `<video class="cs-vid" src="${catchVideoSrc}" poster="${A.poster}" muted loop playsinline webkit-playsinline autoplay aria-hidden="true"></video>
    <svg viewBox="0 0 ${A.w} ${A.h}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <g class="cs-hook"><g transform="rotate(-90) translate(${(-mx).toFixed(1)} ${(-my).toFixed(1)})">${fishSVG(f, `width="${L}" height="${H.toFixed(1)}"`)}</g></g></svg>`;
}
// keeps the fish on the hook while the catch video plays (until the catch screen is closed)
function followHook(el) {
  const v = el.querySelector('.cs-vid'), g = el.querySelector('.cs-hook'); if (!v || !g) return;
  // phones only autoplay muted video, and "muted" written into the HTML doesn't always count: set it here
  v.muted = v.defaultMuted = true; v.playsInline = true;
  const go = () => { if (el.isConnected && v.paused) v.play().catch(() => {}); };
  go(); v.addEventListener('canplay', go, {once: true}); setTimeout(go, 300);
  const n = CATCH_TRACK.length;
  const step = () => {
    if (!el.isConnected) return;
    const fpos = (v.currentTime || 0) * CATCH_VIDEO.fps, i = Math.floor(fpos) % n, k = fpos - Math.floor(fpos);
    const a = CATCH_TRACK[i], b = CATCH_TRACK[(i + 1) % n], mix = (j) => a[j] + (b[j] - a[j]) * k;
    g.setAttribute('transform', `translate(${mix(1).toFixed(1)} ${mix(2).toFixed(1)}) rotate(${mix(3).toFixed(2)})`);
    requestAnimationFrame(step);
  };
  step();
}

const TRAY = {y: 418, xs: [600, 850, 1100], len: 280};
// where each fish lies on the tray: up to 3 side by side; more fish pile up in rows of 4
function trayLayout(n) {
  // upright phone: only the middle of the scale is visible, so the three fish lie closer together and smaller
  if (n <= 3 && innerWidth < innerHeight) return {L: 170, at: [[722, 414], [836, 396], [950, 414]].slice(0, n)};
  if (n <= 3) return {L: TRAY.len, at: TRAY.xs.slice(0, n).map((x) => [x, TRAY.y])};
  const per = 4, L = 210, x0 = 560, span = 580;
  return {L, at: Array.from({length: n}, (_, i) => {
    const row = Math.floor(i / per), k = i % per;
    return [x0 + (k + .5) * span / per + (row % 2 ? 36 : 0) - 18, TRAY.y - row * 44];
  })};
}

// money each player earned: solo = their own fish; team = each round's fish split by that round's right answers
// kilos of fish a player brought in (team fish are shared by right answers)
function kgOf(pi) {
  return G.catches.reduce((sum, c) => {
    if (c.pi === pi) return sum + c.kg;
    if (c.pi !== -1) return sum;
    // team fish: each player gets the part their own answers added to its weight
    const own = G.players.map((p) => (p.kgs[c.level] || []).reduce((a, b) => a + b, 0)), all = own.reduce((a, b) => a + b, 0);
    return sum + c.kg * (all ? own[pi] / all : 1 / G.players.length);
  }, 0);
}

// shrink a row's name and subtitle so they end before the amount on the right
function fitBoardRows() {
  document.querySelectorAll('#boardRows .brow').forEach((g) => {
    const st = g.querySelector('.b-stat');
    const left = +st.getAttribute('x') - st.getComputedTextLength();
    g.querySelectorAll('.b-fit').forEach((t) => {
      const fs0 = +t.dataset.fs; t.setAttribute('font-size', fs0);
      const room = left - 22 - +t.getAttribute('x'), w = t.getComputedTextLength();
      if (w > room && room > 0) t.setAttribute('font-size', (fs0 * room / w).toFixed(1));
    });
  });
  // the line under the names stays one size within a column
  [0, 1].forEach((col) => {
    const subs = [...document.querySelectorAll(`#boardRows .brow[data-col="${col}"]`)].map((g) => g.querySelectorAll('.b-fit')[1]);
    const min = Math.min(...subs.map((t) => +t.getAttribute('font-size')));
    subs.forEach((t) => t.setAttribute('font-size', min));
  });
}

// sentence: 3 sentences, the misspelled one green (the one to tap), the others red
// fill: sentence with the gap, 3 words, right one green, others red
// word: the sentence with the wrong word in red, the correction in green under it
function reviewEntry(e, k) {
  const dot = `<span class="rv-dot ${e.ok ? 'ok' : 'no'}">${k + 1}</span>`;
  if (e.skipped) return `<div class="rv-ans">${dot}<div><span class="rv-note">Round finished early: counted as ${e.ok ? 'right' : 'wrong'}</span></div></div>`;
  const late = e.pick < 0 ? '<span class="rv-note">&#9203; Time ran out</span>' : '';
  const picked = (i) => (i === e.pick ? '<em>PICKED</em>' : '');
  let body = '';
  if (e.mode === 'sentence') {
    body = e.items.map((it, i) => `<div class="rv-opt ${it.target ? 'g' : 'r'}">${esc(it.text)}${picked(i)}</div>`).join('');
  } else if (e.mode === 'fill') {
    body = `<div>${esc(e.before)}<span class="rv-gap"></span>${esc(e.after)}</div>
      <div class="rv-words">${e.items.map((it, i) => `<span class="rv-w ${it.target ? 'g' : 'r'}">${esc(it.text)}${picked(i)}</span>`).join('')}</div>`;
  } else {

// A4 PDF of every answer (jsPDF, loaded only when someone downloads). One page (or more) per player.
let jsPdfLoad = null;
function loadJsPdf() {
  return jsPdfLoad = jsPdfLoad || new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    sc.onload = () => res(window.jspdf.jsPDF); sc.onerror = () => { jsPdfLoad = null; rej(new Error('PDF library failed to load')); };
    document.head.appendChild(sc);
  });
}
async function downloadAnswers(list) {
  let JsPDF;
  try { JsPDF = await loadJsPdf(); } catch (e) { alert('Could not create the PDF (no internet?). Try again.'); return; }
  const doc = new JsPDF({unit: 'mm', format: 'a4'});
  const W = 210, H = 297, M = 16, maxW = W - 2 * M;
  // the built-in PDF font only knows Western letters, so accents are dropped (č -> c)
  const t = (x) => String(x ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[\u2018\u2019]/g, "'").replace(/[^\x20-\x7e]/g, '');
  const C = {ink: [20, 30, 50], muted: [110, 120, 140], g: [22, 140, 75], r: [200, 45, 50], line: [220, 226, 236], band: [242, 238, 252]};
  let y = M;
  const color = (c) => doc.setTextColor(...c);
  const room = (h) => { if (y + h > H - M) { doc.addPage(); y = M; } };
  // words laid out left to right in their own colours, wrapping at the margin
  const rich = (parts, x0, size = 11, bold = false) => {
    doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(size);
    const lh = size * .42; let x = x0;
    room(lh + 1);
    parts.forEach((p) => {
      t(p.text).split(/(\s+)/).filter((w) => w !== '').forEach((w) => {
        if (/^\s+$/.test(w)) { x += doc.getTextWidth(' ') * w.length; return; }
        doc.setFont('helvetica', p.bold ? 'bold' : bold ? 'bold' : 'normal');
        const ww = doc.getTextWidth(w);
        if (x + ww > M + maxW && x > x0) { y += lh; room(lh); x = x0; }
        color(p.c || C.ink); doc.text(w, x, y);
        if (p.strike) { doc.setDrawColor(...(p.c || C.ink)); doc.setLineWidth(.35); doc.line(x, y - size * .12, x + ww, y - size * .12); }
        if (p.under) { doc.setDrawColor(...(p.c || C.ink)); doc.setLineWidth(.3); doc.line(x, y + .9, x + ww, y + .9); }
        x += ww;
      });
    });
    y += lh + 1.2;
  };
  const date = new Date().toLocaleDateString('en-GB', {day: 'numeric', month: 'long', year: 'numeric'});
  list.forEach((p, n) => {
    if (n) { doc.addPage(); y = M; }
    const right = p.results.flat().filter(Boolean).length, asked = p.results.flat().length;
    const score = LEVELS.reduce((a, _, lv) => a + roundScore(p, lv), 0);
    color(C.muted); doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.text('GUMMY THE FISHERMAN  -  ANSWER REVIEW', M, y); doc.text(t(date), W - M, y, {align: 'right'}); y += 9;
    color(C.ink); doc.setFontSize(22); doc.text(t(p.name), M, y); y += 7;
    color(C.muted); doc.setFont('helvetica', 'normal'); doc.setFontSize(11);
    doc.text(t(`${right} of ${asked} right  -  score ${score}/${LEVELS.length * 10}  -  ${MODES[G.mode].name}  -  ${PLAYS[G.play].name}`), M, y); y += 4;
    doc.setDrawColor(...C.line); doc.setLineWidth(.5); doc.line(M, y, W - M, y); y += 7;
    LEVELS.forEach((L, lv) => {
      room(16);
      doc.setFillColor(...C.band); doc.roundedRect(M, y - 5, maxW, 8, 2, 2, 'F');
      color(C.ink); doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.text(t(`Round ${lv + 1}  -  ${L.name}`), M + 3, y + .6);
      const rr = p.results[lv].filter(Boolean).length;
      color(rr === p.results[lv].length ? C.g : rr ? C.ink : C.r); doc.text(`${rr}/${p.results[lv].length} right`, W - M - 3, y + .6, {align: 'right'});
      y += 9;
      (p.log[lv] || []).forEach((e, k) => {
        room(14);
        const head = e.skipped ? (e.ok ? 'RIGHT (round finished early)' : 'WRONG (round finished early)') : e.pick < 0 ? 'WRONG - time ran out' : e.ok ? 'RIGHT' : 'WRONG';
        doc.setFillColor(...(e.ok ? C.g : C.r)); doc.circle(M + 2.2, y - 1.3, 2.2, 'F');
        doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.text(String(k + 1), M + 2.2, y - .3, {align: 'center'});
        color(e.ok ? C.g : C.r); doc.setFontSize(10); doc.text(head, M + 7, y); y += 5.5;
        const X = M + 7;
        if (e.skipped) { y += 1; return; }
        const pickMark = (i) => (i === e.pick ? [{text: '  < picked', c: C.muted}] : []);
        if (e.mode === 'sentence') {
          e.items.forEach((it, i) => rich([{text: (it.target ? 'has the mistake:  ' : 'no mistake:  '), c: C.muted}, {text: it.text, c: it.target ? C.g : C.r, bold: i === e.pick}, ...pickMark(i)], X));
        } else if (e.mode === 'fill') {
          rich([{text: e.before}, {text: '______', c: C.muted}, {text: e.after}], X);
          rich(e.items.flatMap((it, i) => [{text: it.text, c: it.target ? C.g : C.r, bold: true, under: i === e.pick}, {text: i === e.pick ? ' (picked)' : '', c: C.muted}, {text: '      '}]), X);
        } else {
          const ti = e.items.findIndex((it) => it.target);
          rich(e.items.map((it, i) => ({text: it.text + ' ', c: i === ti ? C.r : C.ink, strike: i === ti, under: i === e.pick && i !== ti})), X);
          rich([{text: 'Correct: ', c: C.muted}, {text: e.items[ti].fix, c: C.g, bold: true}, ...(!e.ok && e.pick >= 0 ? [{text: '      Tapped: ', c: C.muted}, {text: e.items[e.pick].text, c: C.r}] : [])], X);
        }
        y += 2.5;
      });
      y += 3;
    });
  });
  const who = list.length > 1 ? 'all-players' : t(list[0].name).toLowerCase().replace(/[^a-z0-9]+/g, '-');
  doc.save(`gummy-answers-${who}-${new Date().toISOString().slice(0, 10)}.pdf`);
}

// lobby fits the screen: measure the window and shrink the lineup until it fits, so it never scrolls.
// On a very small screen (it would have to shrink below MIN_FIT) it scrolls normally instead.
const MIN_FIT = 0.55;
function fitLobby() {
  const lobby = $('lobby'), fit = $('lobbyFit');
  if (lobby.hidden) return;
  fit.style.transform = ''; fit.style.marginBottom = '';
  const cs = getComputedStyle(lobby);
  const room = window.innerHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const need = fit.offsetHeight;
  const s = Math.min(1, room / need);
  const on = s >= MIN_FIT;
  lobby.classList.toggle('fit', on);
  if (on && s < 1) {
    fit.style.transform = `scale(${s})`;
    fit.style.marginBottom = `${-need * (1 - s)}px`; // give back the space the shrink freed up, so it stays centred
  }
}

// lobby video: downloaded completely first (with a progress bar on the loading screen), so it loops smoothly
// from the very first second. If that takes too long or fails, it simply streams instead.
const LOBBY_VIDEO = 'video/lobby.mp4';
const BOOT_MAX_MS = 25000;
async function bootVideo() {
  const vid = $('lobbyVid'), bar = $('bootBar'), tx = $('bootTx');
  const show = (p) => { bar.style.width = p + '%'; tx.textContent = `Loading… ${p}%`; };
  let src = LOBBY_VIDEO;
  const stop = new AbortController(), timer = setTimeout(() => stop.abort(), BOOT_MAX_MS);
  try {
    const r = await fetch(LOBBY_VIDEO, {signal: stop.signal});
    if (!r.ok || !r.body) throw new Error(r.status);
    const total = +r.headers.get('content-length') || 0, reader = r.body.getReader(), parts = [];
    let got = 0;
    for (;;) {
      const {done, value} = await reader.read(); if (done) break;
      parts.push(value); got += value.length;
      if (total) show(Math.min(99, Math.round(got / total * 100))); else tx.textContent = `Loading… ${(got / 1048576).toFixed(1)} MB`;
    }
    src = URL.createObjectURL(new Blob(parts, {type: 'video/mp4'}));
  } catch {} // too slow, offline or an old browser: the video streams normally instead
  clearTimeout(timer);
  vid.src = src; $('roundVid').src = src;
  // the catch video (1 MB) is only needed after the first round: it downloads quietly in the background
  fetch(CATCH_VIDEO.src).then((r) => (r.ok ? r.blob() : null)).then((b) => { if (b) catchVideoSrc = URL.createObjectURL(b); }).catch(() => {});
  await new Promise((res) => { vid.addEventListener('canplay', res, {once: true}); vid.addEventListener('error', res, {once: true}); setTimeout(res, 4000); });
  show(100);
  playLobbyVideo();
  $('boot').classList.add('out'); setTimeout(() => $('boot').remove(), 500);
}

    const v = $(vid); if (!v.src) return;
    if ($(screen).hidden || document.hidden) v.pause(); else v.play().catch(() => {});
  });
}

async function pjScanLoop(v) {
  let detector = null;
  if ('BarcodeDetector' in window) { try { detector = new BarcodeDetector({formats: ['qr_code']}); } catch (e) {} }
  if (!detector) { try { await pjLoad(PJ_QR_JS); } catch (e) {} }
  const cv = document.createElement('canvas'), cx = cv.getContext('2d', {willReadFrequently: true});
  const step = async () => {
    if (PJ.screen !== 'scan' || !PJ.stream) return;
    let txt = '';
    try {
      if (detector) { const r = await detector.detect(v); txt = r[0]?.rawValue || ''; }
      else if (window.jsQR && v.videoWidth) {
        const w = 480, h = Math.round(v.videoHeight / v.videoWidth * w); cv.width = w; cv.height = h;
        cx.drawImage(v, 0, 0, w, h); txt = jsQR(cx.getImageData(0, 0, w, h).data, w, h)?.data || '';
      }
    } catch (e) {}
    const code = pjCodeFrom(txt);
    if (code) { navigator.vibrate?.(40); pjConnect(code); return; }
    setTimeout(step, 180);
  };
  step();
}
function pjCodeFrom(txt) {
  if (!txt) return '';
  try { const j = new URL(txt).searchParams.get('join'); if (/^\d{6}$/.test(j || '')) return j; } catch (e) {}
  const m = txt.match(/\b(\d{6})\b/); return m ? m[1] : '';
}
