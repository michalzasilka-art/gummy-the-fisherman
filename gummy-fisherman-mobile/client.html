    ${m.who != null ? pjAva(m.av ?? 0) : ''}
    <h2 class="h">${mine && m.done ? 'Nice, done!' : esc(m.who) + (m.done ? ' answered' : "'s turn")}</h2>
    <p class="pj-sub">${mine ? 'Wait for your next turn.' : 'Look at the big screen. Your turn is coming!'}</p></div>`, true);
}
function pjWatch(msg) { pjShow('watch', `<div class="pj-card pj-center">${pjAva(PJ.me.av)}<h2 class="h">${esc(msg)}</h2></div>`, true); }
function pjTurn(m) {
  // the last answer's right / wrong stays up a moment before the next question (one player: turns follow at once)
  const hold = PJ.screen === 'res' ? 1300 - (performance.now() - PJ.resAt) : 0, got = performance.now();
  if (hold > 0) { PJ.next = m; setTimeout(() => { if (PJ.next === m) { PJ.next = null; pjTurnShow(m, got); } }, hold); return; }
  pjTurnShow(m, got);
}
function pjTurnShow(m, got) {
  PJ.turn = {id: m.id, end: got + m.secs * 1000, secs: m.secs, sent: false};
  const sent = m.kind === 'sentence';
  pjShow('turn', `<div class="pj-turn"><div class="pj-round">ROUND ${m.round} &middot; YOUR TURN</div>
    <div class="pj-hint">${esc(m.hint)}</div>
    ${m.kind === 'fill' ? `<div class="pj-fsent">${esc(m.before)}<span class="gap">?</span>${esc(m.after)}</div>` : ''}
    <div class="pj-words ${m.kind}">${m.words.map((w, i) => `<button data-ans="${i}">${esc(w)}</button>`).join('')}</div>
    <div class="pj-time"><i id="pjBar"></i></div><div class="pj-left" id="pjLeft"></div></div>`, true);
  const tick = () => {
    if (PJ.screen !== 'turn' || !PJ.turn || PJ.turn.id !== m.id) return;
    const rem = Math.max(0, PJ.turn.end - performance.now());
    const bar = $('pjBar'), left = $('pjLeft');
    if (bar) bar.style.width = (rem / (PJ.turn.secs * 1000) * 100) + '%';
    if (left) left.textContent = PJ.turn.sent ? 'Answer sent…' : rem > 0 ? (rem / 1000).toFixed(1) + 's left' : "Time's up…";
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  navigator.vibrate?.([60, 40, 60]);
  sfx.turn();
}
function pjResult(m) {
  PJ.turn = null; PJ.resAt = performance.now();
  const head = m.timeout ? "Time's up!" : m.ok ? 'Right!' : 'Not quite';
  pjShow('res', `<div class="pj-card pj-center pj-res ${m.ok ? 'ok' : 'no'}"><div class="pj-mark">${m.ok ? '&#10003;' : m.timeout ? '&#9201;' : '&#10007;'}</div>
    <h2 class="h">${head}</h2>
    ${m.ok ? '' : `<p class="pj-sub">${m.kind === 'word' ? `The wrong word was <s>${esc(m.wrong)}</s> &rarr; <b>${esc(m.right)}</b>`
      : m.kind === 'sentence' ? `Right spelling: <b>${esc(m.right)}</b>` : `The right word: <b>${esc(m.right)}</b>`}</p>`}</div>`, true);
  navigator.vibrate?.(m.ok ? 50 : [120, 60, 120]);
  if (m.ok) sfx.right(); else sfx.wrong();
}
function pjEnded(msg) {
  pjShow('ended', `<div class="pj-card pj-center"><h2 class="h">${msg}</h2>
    <button class="cta h" data-pj="again">Join a game</button><button class="pj-link" data-pj="close">Back to Gummy</button></div>`);
}

// ---- connection ----
async function pjConnect(code) {
  pjStopCam();
  PJ.code = code; PJ.joined = false; PJ.closing = false;
  pjBusy(`Looking for game ${pjFmt(code)}…`);
  try { await pjLoad(PJ_PEER_JS); } catch (e) { return pjCodeScreen('No internet connection. Try again.'); }
  pjOpenConn(false);
}
function pjOpenConn(rejoin) {
  const code = PJ.code;
  if (PJ.conn) { try { PJ.conn.close(); } catch (e) {} PJ.conn = null; }
  const start = () => {
    const conn = PJ.peer.connect(PJ_PREFIX + code, {reliable: true});
    PJ.conn = conn;
    const t = setTimeout(() => { if (!conn.open && PJ.conn === conn) pjLost(rejoin ? null : 'No game found with this code. Check the code on the big screen.'); }, 12000);
    conn.on('open', () => { clearTimeout(t); PJ.tries = 0; if (rejoin && PJ.joined) pjSendJoin(); else conn.send({t: 'hello'}); });
    conn.on('data', pjData);
    conn.on('close', () => { if (PJ.conn === conn && !PJ.closing) pjLost(null); });
  };
  if (PJ.peer && !PJ.peer.destroyed && PJ.peer.open) return start();
  if (PJ.peer) PJ.peer.destroy();
  const peer = new Peer(); PJ.peer = peer;
  peer.on('open', () => { if (PJ.peer === peer) start(); });
  peer.on('error', (err) => {
    if (PJ.peer !== peer || PJ.closing) return;
    if (err.type === 'peer-unavailable') pjLost(PJ.joined ? null : 'No game found with this code. Check the code on the big screen.');
    else if (['network', 'server-error', 'socket-error', 'socket-closed', 'browser-incompatible', 'webrtc'].includes(err.type)) pjLost(PJ.joined ? null : 'Could not connect. Check the internet and try again.');
  });
  peer.on('disconnected', () => { if (PJ.peer === peer && !peer.destroyed && !PJ.closing) peer.reconnect(); });
}
// lost the big screen: in a game, keep trying for a while; before joining, back to the code screen
function pjLost(msg) {
  if (PJ.closing) return;
  if (!PJ.joined) { if (PJ.screen === 'busy' || PJ.screen === 'profile') pjCodeScreen(msg || 'Lost the connection. Try again.'); return; }
  if (PJ.tries++ > 8) return pjEnded('Lost the connection to the big screen.');
  if (PJ.screen !== 'busy') pjBusy('Reconnecting to the game…');
  setTimeout(() => { if (!PJ.closing) pjOpenConn(true); }, 1500);
}
function pjSendJoin() { try { PJ.conn.send({t: 'join', token: pjToken, name: PJ.me.name, av: PJ.me.av}); } catch (e) {} }
function pjData(m) {
  if (!m || typeof m !== 'object') return;
  switch (m.t) {
    case 'hello':
      if (m.started && !PJ.joined) { pjSendJoin(); return; } // maybe this phone was in the game already
      pjProfile(); return;
    case 'err':
      if (PJ.asked) { PJ.asked = false; pjProfile(esc(m.msg)); return; } // e.g. the name is taken
      if (PJ.screen === 'busy' && !PJ.joined) { PJ.closing = true; PJ.conn?.close(); pjEnded(esc(m.msg)); return; }
      pjProfile(esc(m.msg)); return;
    case 'joined': PJ.joined = true; PJ.asked = false; PJ.me = {name: m.name, av: m.av}; store.set('gummyPhoneMe', PJ.me); return;
    case 'lobby': pjLobby(); return;
    case 'turn': pjTurn(m); return;
    case 'res': pjResult(m); return;
    case 'wait': if (PJ.screen !== 'res' || m.who !== PJ.me.name) pjWait(m); else setTimeout(() => { if (PJ.screen === 'res') pjWait(m); }, 2200); return;
    case 'watch': if (PJ.screen === 'res') setTimeout(() => pjWatch(m.msg), 1800); else pjWatch(m.msg); return;
    case 'kicked': pjQuit(); pjEnded('You were removed from the game.'); return;
    case 'bye': pjQuit(); pjEnded('The big screen closed the game.'); return;
  }
}
function pjQuit() {
  PJ.closing = true; pjStopCam();
  try { if (PJ.conn?.open && PJ.joined) PJ.conn.send({t: 'leave'}); } catch (e) {}
  setTimeout(() => { try { PJ.conn?.close(); PJ.peer?.destroy(); } catch (e) {} PJ.conn = null; PJ.peer = null; }, 150);
  PJ.joined = false; PJ.turn = null;
}
function pjClose() { pjQuit(); const el = $('pj'); if (el) { el.hidden = true; el.innerHTML = ''; } document.body.classList.remove('pj-on'); PJ.screen = ''; }

// ---- input ----
function pjSubmit(form) {
  if (!form) return;
  if (PJ.screen === 'code') {
    const c = ($('pjCode')?.value || '').replace(/\D/g, '');
    if (c.length !== 6) { form.querySelector('.pj-err').textContent = 'The code has 6 digits.'; return; }
    pjConnect(c);
  } else if (PJ.screen === 'profile') {
    const name = ($('pjName')?.value || '').trim().replace(/\s+/g, ' ');
    if (!name) { form.querySelector('.pj-err').textContent = 'Type your name.'; return; }
    PJ.me.name = name; store.set('gummyPhoneMe', PJ.me);
    if (!PJ.conn?.open) return pjLost(null);
    PJ.asked = true; pjSendJoin(); pjBusy('Joining…');
  }
}
function pjClick(e) {
  const av = e.target.closest('[data-av]');
  if (av && PJ.screen === 'profile') { PJ.me.av = +av.dataset.av; $('pj').querySelectorAll('[data-av]').forEach((b) => b.classList.toggle('on', b === av)); return; }
  const a = e.target.closest('[data-ans]');
  if (a && PJ.turn && !PJ.turn.sent) {
    PJ.turn.sent = true;
    $('pj').querySelectorAll('[data-ans]').forEach((b) => { b.disabled = true; b.classList.toggle('picked', b === a); });
    try { PJ.conn.send({t: 'ans', id: PJ.turn.id, i: +a.dataset.ans}); } catch (err) {}
    return;
  }
  const b = e.target.closest('[data-pj]'); if (!b) return;
  const go = b.dataset.pj;
  if (go === 'scan') pjScanScreen();
  else if (go === 'code') pjCodeScreen();
  else if (go === 'profile') pjProfile();
  else if (go === 'again') { PJ.code = ''; pjCodeScreen(); }
  else if (go === 'close') pjClose();
  else if (go === 'leave') { if (PJ.screen === 'profile' && !PJ.joined) return pjClose(); if (confirm('Leave this game?')) pjClose(); }
}
function openJoin(how) {
  PJ.closing = false;
  if (PJ.joined && PJ.conn?.open) { pjLayer(); return; }
  PJ.code = ''; how === 'qr' ? pjScanScreen() : pjCodeScreen();
}
$('joinCode').addEventListener('click', () => openJoin('code'));
$('joinQr').addEventListener('click', () => openJoin('qr'));
// the QR code on the big screen opens this app with ?join=<code>
{ const j = new URLSearchParams(location.search).get('join'); if (/^\d{6}$/.test(j || '')) setTimeout(() => { PJ.closing = false; pjConnect(j); }, 300); }

renderLobby();
fitLobby();
})();
</script>
</body>
