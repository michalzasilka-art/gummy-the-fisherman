<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gummy "The FisherMan"</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#071427; --panel:#0f2140; --panel2:#132b52; --line:#2c5a96; --glow:#5fb8ff;
    --text:#eaf4ff; --muted:#93acd0; --good:#35d07f; --bad:#ff5a6e; --gold:#ffc53d;
    --common:#a6b3c4; --rare:#3b9bff; --epic:#b45cff; --legendary:#ffb020; --mythical:#ff5fd2; --money:#6dfcae;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Nunito,-apple-system,BlinkMacSystemFont,sans-serif}
  body{background:radial-gradient(120% 60% at 50% 0%,#12325f 0%,#071427 60%) fixed}
  button{font:inherit;color:inherit;cursor:pointer}
  .h{font-family:"Lilita One",Nunito,sans-serif;letter-spacing:.02em;font-weight:400}
  .screen{max-width:1100px;margin:0 auto;padding:14px 14px 28px}
  [hidden]{display:none!important}

  /* ---------- lobby ---------- */
  .logo{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 14px}
  .logo img{width:74px;height:74px;border-radius:22px;object-fit:cover;box-shadow:0 0 0 3px #ff7fd8,0 10px 30px rgba(255,95,210,.35)}
  .logo-t{line-height:.95;text-align:left}
  .logo-t .a{font-size:34px;color:#ff8fe0;text-shadow:0 3px 0 #8a1f73,0 0 22px rgba(255,120,220,.45)}
  .logo-t .b{font-size:22px;color:#7fd3ff;text-shadow:0 2px 0 #0d3b73}
  .tagline{text-align:center;color:var(--muted);font-weight:800;font-size:14px;margin:-4px 0 14px}
  .timebox{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:14px}
  .timebox label{font-size:11px;letter-spacing:.14em;color:#b99cff;font-weight:900;white-space:nowrap}
  .timebox input{flex:1;accent-color:#9b7bff;--acc:#9b7bff}
  /* time sliders: own track, so the fill goes all the way to the right at the maximum (--p is set from JS) */
  /* !important: the hero cards style every input like a text box, which would wipe out this track */
  .timebox input,.htime input,.ptime input{-webkit-appearance:none;appearance:none;height:8px!important;padding:0!important;border:0!important;border-radius:4px!important;margin:0;outline:none;cursor:pointer;
    background:linear-gradient(to right,var(--acc) 0 var(--p,50%),rgba(255,255,255,.2) var(--p,50%) 100%)!important}
  .timebox input::-webkit-slider-thumb,.htime input::-webkit-slider-thumb,.ptime input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:var(--acc);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  .timebox input::-moz-range-thumb,.htime input::-moz-range-thumb,.ptime input::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--acc);border:2px solid #fff}
  .timebox input:focus-visible,.htime input:focus-visible,.ptime input:focus-visible{box-shadow:0 0 0 3px rgba(255,255,255,.35)}
  .timebox output{min-width:44px;text-align:center;background:#231a52;border:2px solid #6e56d6;border-radius:10px;padding:2px 6px;font-weight:900}
  .heroes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(min-width:760px){.heroes{grid-template-columns:repeat(4,1fr)}}
  .hero{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:20px;padding:12px 10px;text-align:center;transition:opacity .2s,filter .2s}
  .hero.off{opacity:.45;filter:grayscale(.8)}
  .hero .tag{position:absolute;left:10px;top:10px;font-size:11px;font-weight:900;letter-spacing:.1em;background:#0a1830;border:1px solid var(--line);border-radius:8px;padding:3px 7px}
  .hero .x{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:9px;border:1px solid var(--line);background:#0a1830;color:#ff8fa0;font-weight:900}
  .ava{width:86px;height:86px;border-radius:50%;object-fit:cover;background:#0a1830;border:4px solid var(--ring,#fff);margin:26px auto 10px;display:block}
  .hero input{width:100%;background:#081a33;border:2px solid var(--line);border-radius:12px;color:var(--text);font:inherit;font-weight:900;text-align:center;padding:8px 6px;font-size:16px}
  .hero .ready{margin-top:8px;font-size:12px;color:var(--muted);font-weight:800}
  .cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin:18px 0 10px;padding:16px;border:0;border-radius:18px;background:linear-gradient(135deg,#ff6fd0,#8b5cff);font-size:20px;font-weight:900;box-shadow:0 8px 0 #4b2596,0 14px 30px rgba(139,92,255,.35);transition:transform .1s}
  .cta:active{transform:translateY(3px);box-shadow:0 5px 0 #4b2596}
  .link{display:block;margin:0 auto;background:none;border:0;color:var(--muted);text-decoration:underline;font-weight:800}
  .links{display:flex;justify-content:center;gap:22px;flex-wrap:wrap}
  .links .link{margin:0}
  #ixCount{opacity:.75}

  /* ---------- fish index ---------- */
  .card.wide{max-width:980px;max-height:92vh;display:flex;flex-direction:column}
  .ix-scroll{overflow:auto;min-height:0;flex:1;margin:4px -6px 0;padding:0 6px;text-align:left}
  .ix-h{font-weight:900;letter-spacing:.12em;text-transform:uppercase;font-size:13px;margin:14px 0 8px}
  .ix-h span{color:var(--muted);margin-left:6px}
  .ix-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
  .ix{background:#0a1830;border:2px solid color-mix(in srgb,var(--rc) 55%,transparent);border-radius:14px;padding:6px 8px 8px;text-align:center}
  .ix svg{width:100%;display:block}
  .ix-nm{font-weight:900;font-size:14px}
  .ix-n{font-size:11px;color:var(--muted);font-weight:800}
  .ix-n b{color:var(--text)}
  .ix.unk{border-color:#1c3558}
  .ix[data-f]{cursor:pointer;transition:transform .12s} .ix[data-f]:hover{transform:translateY(-2px)}
  .ix.unk svg{filter:brightness(0) opacity(.4)}
  .ix.unk ellipse{display:none}
  .ixnote .new{color:var(--gold)}

  /* ---------- game ---------- */
  .topbar{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:10px}
  /* game menu: one button top left; it opens a list under it with Leave and the music button */
  .gmenu{justify-self:start;position:relative;z-index:30}
  .gm-btn{display:grid;place-items:center;aspect-ratio:1;padding:7px}
  .gm-list{position:absolute;top:calc(100% + 8px);left:0;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
  .gm-list[hidden]{display:none}
  .gm-item{display:flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer}
  .gm-ico{display:grid;place-items:center;aspect-ratio:1;min-width:2.6em}
  #lvlPill{flex:none}
  /* package picker (Start fishing → Choose a package) */
  .ov .card.pkcard{max-width:min(620px,94vw)}
  .lb-pack{flex:1.4 1 0}
  .lobbar{position:relative;z-index:30} /* the package list opens over the hero cards */
  .lb-pack.open{z-index:40}
  .lb-pack>button{gap:8px}
  .pk-lv.sm{width:auto;height:auto;padding:3px 7px;border-radius:7px;font-size:13px;line-height:1;flex:none}
  .lb-pack .lb-menu{max-height:min(60vh,420px);overflow:auto}
  .lb-pack.open .lb-menu{opacity:1;pointer-events:auto;transform:none}
  .lb-menu .pk-item .pk-row{display:flex;align-items:center;gap:8px}
  .lb-menu .pk-item.on{border-color:var(--lc);background:color-mix(in srgb,var(--lc) 22%,rgba(8,18,36,.3))}
  .pk-list{display:flex;flex-direction:column;gap:10px;margin:14px 0 6px;text-align:left}
  .pk{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px;border:2px solid rgba(255,255,255,.35);border-radius:16px;background:rgba(8,18,36,.35);color:#fff;font:inherit;cursor:pointer;transition:transform .15s,border-color .15s,background .15s}
  .pk:hover{transform:translateY(-2px);border-color:var(--lc);background:rgba(8,18,36,.5)}
  .pk.on{border-color:var(--lc);box-shadow:0 0 0 3px color-mix(in srgb,var(--lc) 35%,transparent)}
  .pk-lv{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:14px;background:var(--lc);color:#14202b;font:700 20px/1 Fredoka,Nunito,sans-serif}
  .pk-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .pk-t b{font:700 clamp(17px,2.3vh,22px)/1.15 Fredoka,Nunito,sans-serif}
  .pk-t small{font-weight:800;font-size:13px;opacity:.75}
  .pk-n{flex:none;text-align:right;font:700 20px/1 Fredoka,Nunito,sans-serif;color:var(--lc)}
  .pk-n small{display:block;font:800 11px/1.2 Nunito,sans-serif;color:#fff;opacity:.7;letter-spacing:.04em}
  @media (max-width:520px){.pk-lv{width:42px;height:42px;font-size:16px}.pk-n{display:none}}
  #modePick{display:none!important} /* one mode only */
  .qrow #lvlPill{height:18px;padding:0 12px;display:flex;align-items:center;font-size:12px;line-height:1;box-shadow:none}
  @media (min-width:1000px){.qrow #lvlPill{height:2.4vh;padding:0 1.4vh;font-size:1.6vh}}
  /* top bar: menu on the left, progress bar with the Round pill on its right in the middle */
  .qrow{display:flex;align-items:center;gap:12px;justify-self:center;width:min(680px,72vw)}
  .qrow .qbar{flex:1;width:auto;margin:0}
  @media (min-width:1000px){.qrow{width:min(86vh,60vw);gap:1.4vh}.qrow .qbar{width:auto;margin:0}}
  #streakPill{justify-self:start}
  .pill{background:#fff;color:#1b2440;border:0;border-radius:999px;padding:7px 13px;font-weight:900;font-size:13px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
  .finish{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:-2px 0 10px;position:relative;z-index:25}
  .finish .pill{font-size:12px;padding:6px 11px}
  .pill.fin-no{background:var(--bad);color:#fff}
  .pill.fin-ok{background:var(--good);color:#04210f}
  @media(min-width:760px){.finish{position:fixed;top:12px;right:12px;margin:0;z-index:25}}
  .scene-wrap{position:relative;border-radius:22px;overflow:hidden;border:3px solid #2d6fb8;box-shadow:0 0 0 3px #0a1f3d,0 12px 40px rgba(0,0,0,.45);background:#0b2a4d}
  .scene-wrap svg.scene{display:block;width:100%;height:auto}
  /* painted level backgrounds (level 1 lake) */
  .photo{position:absolute;inset:0;width:100%;height:100%;display:none}
  #fight .f-rip{fill:none;stroke:rgba(255,255,255,.7);stroke-width:1.6;transform-box:fill-box;transform-origin:center;animation:fRip 2.6s ease-out infinite}
  #fight .f-rip+.f-rip{animation-delay:1.3s}
  @keyframes fRip{from{transform:scale(.6);opacity:.9}to{transform:scale(2.4);opacity:0}}
  #fSplash circle{fill:#eaf8ff}
  #fight .f-face{opacity:0;transition:opacity .18s ease}
  #fight.up #fFaceUp,#fight.down #fFaceDown{opacity:1}
  .scene-wrap.photo-on .photo{display:block}
  .scene-wrap.photo-on #scene{visibility:hidden}
  /* round 1: a looping video instead of the painting; it sits under the photo layer and follows its
     crop / zoom / shake every frame (see syncR1Video) */
  .r1vid{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0;display:none;pointer-events:none;object-fit:cover;background:#4aa3e0}
  .scene-wrap.photo-on.r1-on .r1vid{display:block}
  .scene-wrap.r1-on #photoImg{visibility:hidden}
  .gvid{position:absolute;left:0;top:0;width:729.56px;height:410.38px;transform-origin:0 0;pointer-events:none;display:none}
  .scene-wrap.photo-on.gv-on .gvid{display:block}
  /* 6p final photo (showSixFinal): the picture covers the screen, markers sit over each friend's head.
     Places 1–3: circle filled in the friend's colour; 4–6: frosted grey glass with only the edge in their colour. */
  .sixfin{position:fixed;inset:0;z-index:20;overflow:hidden;background:#0b2a4d}
  /* the whole photo always fits (all six friends visible at 16:9 and 4:3); a blurred copy fills the rest */
  .sixfin::before{content:"";position:absolute;inset:-40px;background:var(--sfbg,url(art/six-final.webp)) center/cover;filter:blur(24px) brightness(.75)}
  .sf-stage{position:absolute;left:50%;top:50%;width:min(100vw,calc(100vh * 1672 / 941));aspect-ratio:1672/941;transform:translate(-50%,-50%);container-type:inline-size}
  .sf-img{position:absolute;inset:0;width:100%;height:100%;display:block}
  .sf-m{position:absolute;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-100%);animation:sfin .5s cubic-bezier(.2,1.4,.4,1) both}
  .sf-c{display:grid;place-items:center;width:3.9cqw;height:3.9cqw;border-radius:50%;border:.28cqw solid var(--c);
    font:400 2.2cqw/1 "Lilita One",Nunito,sans-serif;color:#fff;text-shadow:0 .12cqw 0 rgba(0,0,0,.55),0 0 .4cqw rgba(0,0,0,.5);
    background:rgba(60,64,72,.45);-webkit-backdrop-filter:blur(8px) grayscale(1);backdrop-filter:blur(8px) grayscale(1);box-shadow:0 .3cqw .9cqw rgba(0,0,0,.35)}
  .sf-m.top .sf-c{background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 60%,color-mix(in srgb,var(--c) 75%,#000));
    -webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 0 0 .14cqw rgba(255,255,255,.85),0 .3cqw 1.2cqw color-mix(in srgb,var(--c) 60%,transparent)}
  .sf-m.top.light .sf-c{color:#1b2440;text-shadow:0 .08cqw 0 rgba(255,255,255,.6)}
  .sf-t{margin-top:-.5cqw;padding:.25cqw .7cqw;border-radius:.6cqw;border:.14cqw solid var(--c);white-space:nowrap;
    font:900 1.05cqw/1 Nunito,sans-serif;color:#fff;background:rgba(8,18,36,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  /* bottom bar: the winner line + buttons. 16:9: it lies over the bottom of the photo. Narrower screens (4:3):
     the photo sits at the top at full width and the bar fills the space under it (no blurred strips) */
  .sf-bar{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vh;
    padding:5vh 2vw 2.4vh;background:linear-gradient(transparent,rgba(8,18,36,.55) 45%)}
  .sf-bar .sf-btns{position:static;margin:0}
  /* podium bar: 2nd and 3rd as small cards beside the winner, team total under them, a wavy water edge on top and bubbles */
  /* arrows between the 6p weigh-in and the final photo (bottom-right forward, bottom-left back) */
  .sf-nav{position:fixed;z-index:25;bottom:3vh;width:min(9vh,72px);height:min(9vh,72px);border-radius:50%;cursor:pointer;
    border:1.5px solid rgba(255,255,255,.75);background:rgba(8,18,36,.35);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    color:#fff;font-size:min(4vh,32px);display:grid;place-items:center;transition:transform .15s,background .2s}
  .sf-nav:hover{transform:scale(1.08);background:rgba(8,18,36,.55)}
  .sf-next{right:2.4vw} .sf-back{left:2.4vw;transform:scaleX(-1)} .sf-back:hover{transform:scaleX(-1) scale(1.08)}
  .sf-pod{display:flex;align-items:center;gap:1.4vw}
  .sf-pc{display:none;align-items:center;gap:.6em;padding:.35em .9em .35em .4em;border-radius:999px;border:2px solid var(--mc);
    background:rgba(8,18,36,.55);color:#fff;font:900 clamp(13px,1.9vh,18px)/1.1 Nunito,sans-serif;white-space:nowrap}
  .sf-pc img{width:2.4em;height:2.4em;border-radius:50%;object-fit:cover;border:2px solid var(--pc)}
  .sf-pc .md{display:grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--mc);color:#1b2440;font:400 1em/1 "Lilita One",sans-serif}
  .sf-pc small{display:block;font-weight:800;opacity:.8}
  .sf-pc.s2{--mc:#d6dce6} .sf-pc.s3{--mc:#e09a5b}
  .sf-tot{display:none;font:800 clamp(12px,1.7vh,15px)/1 Nunito,sans-serif;letter-spacing:.14em;color:#a8caff;text-transform:uppercase}
  .sf-tot b{color:#fff}
  .sf-wave,.sf-bub{display:none}
  .sf-win{display:flex;align-items:center;gap:.6em;padding:.45em 1.3em;border-radius:999px;border:2px solid var(--wc,#ffc53d);
    background:rgba(8,18,36,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;white-space:nowrap;
    font:400 clamp(18px,3.2vh,30px)/1 "Lilita One",Nunito,sans-serif;box-shadow:0 0 22px color-mix(in srgb,var(--wc,#ffc53d) 55%,transparent)}
  .sf-win img{width:1.4em;height:1.4em}
  .sf-win b{color:var(--wc,#ffc53d);font-weight:400}
  /* bar under the photo: only when there is room for it there (sixFit sets .under); otherwise it lies over the photo */

    .sixfin.under::before{display:none}
    .sixfin.under{background:#1f4a3a}
    .sixfin.under .sf-stage{top:0;transform:translateX(-50%);width:100vw}
    .sixfin.under .sf-bar{top:calc(100vw * 941 / 1672);padding-top:1.5vh;padding-bottom:1.3vh;gap:.9vh;overflow:hidden;
      background:none;border-top:3px solid var(--wc,#ffc53d);box-shadow:0 -8px 24px rgba(0,0,0,.35);isolation:isolate}
    /* behind the bar: the mountain-forest painting, blurred (inset < 0 so the blur has no soft edges), a tint over it for the text */
    .sixfin.under .sf-bar::before{content:"";position:absolute;inset:-30px;z-index:-1;background:var(--sfbar,url(art/six-bar-bg.webp)) center 40%/cover;filter:blur(9px) saturate(1.1)}
    .sixfin.under .sf-bar::after{content:"";position:absolute;inset:0;z-index:-1;
      background:radial-gradient(120% 90% at 50% 0,color-mix(in srgb,var(--wc,#ffc53d) 22%,transparent),transparent 60%),linear-gradient(rgba(12,40,80,.15),rgba(6,18,36,.5))}
    .sixfin.under .sf-pc,.sixfin.under .sf-tot{display:flex}
    .sixfin.under .sf-tot{display:block}
    .sixfin.under .sf-wave{display:block;position:absolute;left:0;right:0;top:0;width:100%;height:16px;opacity:.35;pointer-events:none}
    .sixfin.under .sf-wave path{fill:var(--wc,#ffc53d)}
    .sixfin.under .sf-bub{display:block;position:absolute;inset:0;pointer-events:none}
    .sixfin.under .sf-bub i{position:absolute;bottom:-12px;width:8px;height:8px;border-radius:50%;border:1.5px solid rgba(168,202,255,.45);animation:sfbub 7s linear infinite}
    .sixfin.under .sf-bub i:nth-child(1){left:6%;animation-delay:0s}.sf-bub i:nth-child(2){left:17%;width:5px;height:5px;animation-delay:2.4s}
    .sixfin.under .sf-bub i:nth-child(3){left:30%;animation-delay:4.6s}.sf-bub i:nth-child(4){left:71%;width:6px;height:6px;animation-delay:1.2s}
    .sixfin.under .sf-bub i:nth-child(5){left:84%;animation-delay:3.5s}.sf-bub i:nth-child(6){left:94%;width:5px;height:5px;animation-delay:5.8s}
    .sixfin.under .sf-pod,.sixfin.under .sf-tot,.sixfin.under .sf-btns{position:relative;z-index:1;bottom:auto}
  @keyframes sfbub{from{transform:translateY(0);opacity:0}15%{opacity:1}to{transform:translateY(-36vh);opacity:0}}
  }
  /* the winner: a bigger circle with a crown, glowing and gently pulsing, a light behind it, golden kilo tab */
  .sf-m.first{z-index:2}
  .sf-m.first .sf-c{width:5.6cqw;height:5.6cqw;font-size:3.2cqw;border-width:.35cqw;animation:sfglow 1.6s ease-in-out infinite alternate}
  .sf-m.first .sf-t{font-size:1.35cqw;padding:.35cqw 1cqw;border-color:#ffc53d;background:rgba(40,28,4,.75);color:#ffe08a}
  .sf-crown{width:3.4cqw;margin-bottom:-.9cqw;filter:drop-shadow(0 .2cqw .4cqw rgba(0,0,0,.45))}
  .sf-spot{position:absolute;width:18cqw;height:18cqw;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;
    background:radial-gradient(circle,color-mix(in srgb,var(--c) 45%,#fff3) 0,color-mix(in srgb,var(--c) 25%,transparent) 35%,transparent 70%);mix-blend-mode:screen;animation:sfin .6s both}
  @keyframes sfglow{from{box-shadow:0 0 0 .2cqw #fff,0 0 1.2cqw var(--c)}to{box-shadow:0 0 0 .2cqw #fff,0 0 3.2cqw var(--c),0 0 5cqw color-mix(in srgb,var(--c) 60%,transparent)}}
  @keyframes sfin{from{opacity:0;transform:translate(-50%,-70%) scale(.6)}to{opacity:1;transform:translate(-50%,-100%)}}
  .sixpull{position:fixed;inset:0;z-index:31;background:#000;display:grid;place-items:center;animation:sixin .35s ease-out}

    .cta{font-size:3.6vh;padding:2.2vh;border-radius:2.6vh;max-width:760px;margin:3vh auto 1.6vh}
    .link{font-size:2.2vh}
    .links{gap:3vw}
    .card.wide{max-width:1400px;width:92vw}
    .ix-h{font-size:2vh;margin:2vh 0 1.2vh}
    .ix-grid{grid-template-columns:repeat(auto-fill,minmax(22vh,1fr));gap:1.2vh}
    .ix{border-radius:2vh;padding:1vh 1vh 1.2vh;border-width:.3vh}

    #game{display:grid;grid-template-rows:auto minmax(0,41vh) auto minmax(0,1fr);gap:1.2vh}
    #game .topbar{margin:0;gap:1vw}
    .pill{font-size:2.2vh;padding:.9vh 2vh}
    .finish{top:2vh;right:2.2vw;gap:.8vw}
    .finish .pill{font-size:1.8vh;padding:.8vh 1.6vh}
    .scene-wrap{height:100%;border-radius:3vh}
    .scene-wrap svg.scene{height:100%}
    .hud{display:flex;align-items:center;justify-content:center;gap:2vw}
    .meter{margin:0}.meter i{width:3vh;height:1.4vh;border-radius:1vh}
    .status{margin:0;font-size:2.8vh;padding:.9vh 2.4vw;max-width:none;border-radius:1.6vh}
    .players{min-height:0;gap:1.2vw;grid-template-columns:var(--cols,repeat(var(--n),1fr));transition:grid-template-columns .15s ease-out}
    .pcard{display:flex;flex-direction:column;min-height:0;border-radius:2.6vh;padding:1.6vh 1.2vw;border-width:.35vh}
    .phead{gap:1vw}
    .phead img{width:6vh;height:6vh;border-width:.5vh}
    .pname{font-size:3vh}
    .pdots i{width:2.2vh;height:2.2vh;border-width:.35vh}
    .pdots{gap:.6vh}
    .pwait{display:none}
    .pcard:not(.active) .phead{flex-wrap:wrap}
    /* more than 4 players: narrow waiting cards, so the dots drop under the name */
    .players.six .pcard:not(.active) .phead{gap:.6vw}
    .players.six .pcard:not(.active) .phead img{width:min(5vh,2.8vw);height:min(5vh,2.8vw)}
    .players.six .pcard:not(.active) .pname{font-size:min(2.4vh,1.35vw)}
    .players.six .pcard:not(.active) .pdots{flex-basis:100%}
    .pcard:not(.active):not(.has-last)::after{content:"waiting\2026";display:flex;flex:1;align-items:center;justify-content:center;color:var(--muted);font-weight:900;font-size:2.6vh;opacity:.7}
    .pcard .q{flex:1;display:none;flex-direction:column;min-height:0;margin-top:1.4vh}
    .pcard.active .q{display:flex}
    .qhint{font-size:1.8vh;margin-bottom:1vh}
    .words{gap:.9vh .7vw;align-content:flex-start}
    .word{font-size:4.2vh;padding:.8vh 1.1vw;border-radius:1.6vh;border-width:.3vh}
    .fix{font-size:2.6vh;margin-top:1.4vh}
    .tbar{height:1.4vh;min-height:1.4vh;margin-top:auto;border-radius:1vh;flex:none}
    .qhint,.fix,.tleft{flex:none}
    .words{flex:0 1 auto;min-height:0;overflow:auto}
    .pcard.widening .words{overflow:hidden}
    .tleft{font-size:1.8vh;margin-top:.6vh}

    .card{max-width:760px;border-radius:4vh;padding:3.4vh 3vw;border-width:.45vh}
    .kicker{font-size:2vh}
    .card h2{font-size:6vh}
    .card p,.card ul{font-size:2.5vh}
    .card .cta{font-size:3.4vh}
    .rbadge{font-size:2.2vh;padding:.8vh 2vh}
    .fishbig{width:70%}
    .odds{font-size:2.3vh;max-width:420px}

    #weigh{display:grid;grid-template-columns:1.1fr 1fr;grid-template-rows:auto auto minmax(0,1fr) auto auto;column-gap:3vw}
    #weigh h1{grid-column:1/-1;font-size:7vh;margin:0}
    #weigh .sub{grid-column:1/-1;font-size:2.4vh;margin-bottom:2vh}
    .scalebox{grid-column:1;grid-row:3;max-width:none;width:100%;height:100%;display:flex;align-items:center;border-radius:3vh}
    .scalebox svg{max-height:44vh}
    #weigh .total{grid-column:1;grid-row:4}
    .total .n{font-size:8vh} .total .rank{font-size:3vh}
    #weigh .total{margin:1.2vh 0 0}
    .rows{grid-column:2;grid-row:3;max-width:none;margin:0;gap:1.6vh;justify-content:center}
    .row{border-radius:2.4vh;padding:1.6vh 1.4vw;gap:1.4vw;border-width:.35vh}
    .row svg{width:14vh}
    .row .nm{font-size:3vh} .row .meta{font-size:2vh} .row .kg{font-size:3.6vh}
    .record{grid-column:2;grid-row:4;align-self:center;font-size:2.4vh}
    #weigh .btnrow{grid-column:1/-1;grid-row:5;width:100%;max-width:1000px;margin:1.6vh auto 0}
    #weigh .btnrow .cta{font-size:3vh;margin:0;flex:1;max-width:none;padding:1.8vh}
  }

  /* lobby fits the screen: the content is measured and shrunk so the lineup never needs a scrollbar */
  .lobby-fit{display:flex;flex-direction:column;width:100%;transform-origin:top center}
  #lobby.fit{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
  #lobby.fit .lobby-fit{flex:none}
  /* the 4 cards always share the width: columns may shrink below their content, and the round picture
     (22vh tall on big screens) shrinks with its card instead of pushing the last card off screen */
  .heroes{grid-template-columns:repeat(2,minmax(0,1fr))}
  @media(min-width:760px){.heroes{grid-template-columns:repeat(4,minmax(0,1fr))}.heroes.six{grid-template-columns:repeat(6,minmax(0,1fr))}.heroes.six .ava{width:min(22vh,9.5vw);height:auto;aspect-ratio:1}}
  .heroes .hero{min-width:0}
  .heroes .ava-wrap{max-width:100%}
  .heroes .ava{max-width:100%;height:auto!important;aspect-ratio:1}
  .heroes .tag{max-width:calc(100% - 64px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- glass look: lobby, overlays (lake painting behind everything) ---------- */
  body:has(#lobby:not([hidden])){background:transparent}
  /* the lobby background: the location's daylight picture, blurred. Switching location pushes the old picture out and the
     new one in, like a PowerPoint "Push" slide (the blur is on the whole strip, so the seam between them is soft too) */
  .lobbybg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#4aa3e0;filter:blur(4px);transform:scale(1.05)}
  .lobbybg i{position:absolute;inset:0;background:center/cover no-repeat;will-change:transform}
  .lobbybg i.in-r{animation:bgInR .95s cubic-bezier(.65,0,.3,1) both}.lobbybg i.out-r{animation:bgOutR .95s cubic-bezier(.65,0,.3,1) both}
  .lobbybg i.in-l{animation:bgInL .95s cubic-bezier(.65,0,.3,1) both}.lobbybg i.out-l{animation:bgOutL .95s cubic-bezier(.65,0,.3,1) both}
  @keyframes bgInR{from{transform:translateX(-100%)}to{transform:none}}@keyframes bgOutR{to{transform:translateX(100%)}}
  @keyframes bgInL{from{transform:translateX(100%)}to{transform:none}}@keyframes bgOutL{to{transform:translateX(-100%)}}
  #lobby .logo{margin-bottom:6px}
  #lobby .logo .title-img{width:auto;height:min(19vh,210px);max-width:94vw;border-radius:0;box-shadow:none;object-fit:contain;filter:drop-shadow(0 8px 18px rgba(0,0,0,.35));transition:opacity .22s ease,transform .32s cubic-bezier(.3,1.5,.5,1)}
  #lobby .logo .title-img.swap{opacity:0;transform:scale(.92);transition:opacity .2s ease,transform .2s ease}
  #lobby .logo-t{text-align:center}
  #lobby .logo-t .a{font-size:min(11vh,64px);text-shadow:0 4px 0 #8a1f73,0 0 30px rgba(255,120,220,.55),0 6px 24px rgba(0,0,0,.35)}
  #lobby .logo-t .b{font-size:min(6vh,36px);color:#fff;text-shadow:0 3px 0 #0d3b73,0 6px 20px rgba(0,0,0,.35)}
  #lobby .tagline{color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.55)}
  /* location under the logo + the map (3 locations, all open) */
  .loctext{text-align:center;margin:-.3em auto .6em;font-family:'Lilita One',system-ui,sans-serif;font-size:clamp(18px,3vh,32px);letter-spacing:.03em;color:#fff;
    text-shadow:0 2px 0 rgba(8,18,36,.45),0 3px 12px rgba(0,0,0,.55)}
  /* the mini map (top right): a square window onto the big map with the chosen location in the middle; under it the
     location's name between two arrows. An arrow flies the map to the next location and slides the background along */
  .minimap{position:fixed;top:14px;right:14px;z-index:5;display:flex;flex-direction:column;align-items:center;gap:8px;--mm:118px}
  .mm-win{position:relative;width:var(--mm);height:var(--mm);border-radius:20px;overflow:hidden;cursor:pointer;padding:0;
    border:3px solid #fff;background:#3f8fcf;box-shadow:0 10px 26px rgba(0,0,0,.4),0 0 0 4px rgba(255,201,74,.0);transition:transform .2s,box-shadow .3s}
  .mm-win:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 14px 30px rgba(0,0,0,.45),0 0 0 4px rgba(255,201,74,.55)}
  .mm-win:active{transform:scale(.97)}
  .mm-zoom{position:absolute;inset:0}
  .mm-zoom.fly{animation:mmfly .95s cubic-bezier(.45,0,.3,1)}
  @keyframes mmfly{45%{transform:scale(.78)}}
  /* the map is 2.6× the window; --x / --y = the point in the middle (in % of the map), moved smoothly */
  .mm-world{position:absolute;left:50%;top:50%;width:260%;height:260%;transform:translate(calc(var(--x) * -1%),calc(var(--y) * -1%));
    transition:transform .95s cubic-bezier(.65,0,.3,1)}
  .mm-world img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
  .mm-pin{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#fff;border:2px solid #ff8a3d;opacity:.75;transition:opacity .4s,transform .4s}
  .mm-pin.on{width:16px;height:16px;margin:-8px 0 0 -8px;opacity:1;border:3px solid #fff;background:radial-gradient(circle at 40% 35%,#fff3c4,#ffc94a 45%,#ff8a3d);
    box-shadow:0 2px 6px rgba(0,0,0,.45);animation:mmpin 1.8s ease-out infinite}
  @keyframes mmpin{0%{box-shadow:0 2px 6px rgba(0,0,0,.45),0 0 0 0 rgba(255,201,74,.85)}80%,100%{box-shadow:0 2px 6px rgba(0,0,0,.45),0 0 0 16px rgba(255,201,74,0)}}
  .mm-win::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 22px rgba(0,30,60,.45)} /* soft vignette */
  .mm-tag{position:absolute;left:6px;top:6px;padding:2px 7px;border-radius:999px;background:rgba(8,18,36,.55);color:#fff;font-weight:900;font-size:9px;letter-spacing:.14em;pointer-events:none}
  .mm-bar{display:flex;align-items:center;gap:6px}
  .mm-arrow{width:30px;height:30px;flex:none;display:grid;place-items:center;padding:0;border-radius:50%;cursor:pointer;color:#4a2300;
    background:linear-gradient(135deg,#ffd76a,#ff9a45);border:2px solid #fff;box-shadow:0 3px 0 #b4561a,0 5px 12px rgba(0,0,0,.3);transition:transform .15s,filter .2s}
  .mm-arrow:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .mm-arrow:active{transform:translateY(2px);box-shadow:0 1px 0 #b4561a,0 3px 8px rgba(0,0,0,.3)}
  .mm-arrow svg{width:55%;height:55%}
  .mm-name{position:relative;overflow:hidden;min-width:0;width:calc(var(--mm) + 34px);text-align:center;font-family:'Lilita One',system-ui,sans-serif;font-size:16px;line-height:1.25;
    letter-spacing:.02em;color:#fff;text-shadow:0 2px 0 rgba(8,18,36,.45),0 3px 10px rgba(0,0,0,.55);white-space:nowrap}
  .mm-name span{display:block}
  .mm-name span.in-r{animation:nmInR .6s cubic-bezier(.3,.7,.3,1) both}.mm-name span.in-l{animation:nmInL .6s cubic-bezier(.3,.7,.3,1) both}
  @keyframes nmInR{from{transform:translateX(-60%);opacity:0}}@keyframes nmInL{from{transform:translateX(60%);opacity:0}}
  @media (prefers-reduced-motion:reduce){.mm-world{transition:none}.mm-zoom.fly,.mm-pin.on,.lobbybg i,.mm-name span{animation:none!important}}
  /* phones / small windows: the logo spans the whole width, so the mini map sits above it (top right) instead of over it */
  @media (max-width:999px){.minimap{position:relative;top:auto;right:auto;width:max-content;margin:0 0 6px auto;gap:5px;--mm:78px}
    .mm-name{font-size:13px;width:calc(var(--mm) + 40px)}.mm-arrow{width:25px;height:25px}.mm-win{border-radius:16px;border-width:2.5px}.mm-tag{font-size:8px}}
  @media (min-width:1000px){.minimap{top:2vh;right:1.6vw;gap:1vh;--mm:19vh}.mm-arrow{width:4.2vh;height:4.2vh}.mm-name{font-size:2.5vh;width:calc(var(--mm) + 4vh)}
    .mm-tag{font-size:1.1vh;left:.8vh;top:.8vh}.mm-pin.on{width:2.2vh;height:2.2vh;margin:-1.1vh 0 0 -1.1vh}}
  .mapov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:4vh 2vh 6vh;background:rgba(3,10,22,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:mapin .25s ease both}
  @keyframes mapin{from{opacity:0}}
  .mapcard{position:relative;width:min(92vw,calc(100vh - 18vh - 90px));display:flex;flex-direction:column;gap:1.2vh;color:#fff;text-align:center}
  .mapcard .kicker{color:#fff;opacity:.8}
  .mapcard h2{margin:0;font-size:clamp(26px,4.4vh,46px);text-shadow:0 3px 10px rgba(0,0,0,.5)}
  .mapimg{position:relative;aspect-ratio:1;border-radius:22px;overflow:hidden;border:2px solid rgba(255,255,255,.75);box-shadow:0 18px 50px rgba(0,0,0,.55)}
  .mapimg img{display:block;width:100%;height:100%;object-fit:cover}
  /* only Glimmerwater Lake is open for now. The blur grows with the distance from the lake: the whole map is blurred most,
     and copies with less and less blur show through in bigger-to-smaller ellipses around the lake (r0 = sharp) */
  .mapimg .map-blur{filter:blur(18px) saturate(.7) brightness(.78);transform:scale(1.08)}
  .mapimg .map-ring{position:absolute;inset:0;--w:44%;--h:30%;
    -webkit-mask-image:radial-gradient(ellipse calc(var(--w) * var(--k)) calc(var(--h) * var(--k)) at 48% 73%,#000 55%,transparent 100%);
    mask-image:radial-gradient(ellipse calc(var(--w) * var(--k)) calc(var(--h) * var(--k)) at 48% 73%,#000 55%,transparent 100%)}
  .mapimg .map-ring.r4{--k:2.3;filter:blur(12px) saturate(.78) brightness(.84);transform:scale(1.05)}
  .mapimg .map-ring.r3{--k:1.85;filter:blur(7px) saturate(.85) brightness(.9);transform:scale(1.03)}
  .mapimg .map-ring.r2{--k:1.5;filter:blur(3.5px) saturate(.93) brightness(.95)}
  .mapimg .map-ring.r1{--k:1.22;filter:blur(1.2px)}
  .mapimg .map-ring.r0{--k:1}
  /* the locations that aren't open yet: a very faint "Coming Soon....." where they will be */
  .msoon{position:absolute;transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap;font-family:'Lilita One',system-ui,sans-serif;
    font-size:clamp(16px,3vh,30px);letter-spacing:.06em;color:#fff;opacity:.28;text-shadow:0 2px 10px rgba(0,0,0,.35)}
  .mpin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.6vh;background:none;border:0;padding:0;cursor:pointer;color:#fff;font:inherit}
  .mpin .dot{width:clamp(18px,3.2vh,30px);height:clamp(18px,3.2vh,30px);border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#ffd36b 45%,#ff9a38);
    box-shadow:0 0 0 4px rgba(255,255,255,.85),0 0 22px #ffd36b;animation:mpulse 1.6s ease-in-out infinite}
  @keyframes mpulse{50%{box-shadow:0 0 0 7px rgba(255,255,255,.45),0 0 34px #ffd36b}}
  .mpin .plate{display:flex;flex-direction:column;align-items:center;gap:2px;padding:.5em .9em;border-radius:14px;white-space:nowrap;
    background:rgba(8,18,36,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1.5px solid rgba(255,255,255,.7);transition:transform .15s,border-color .2s}
  .mpin .plate b{font-family:'Lilita One',system-ui,sans-serif;font-weight:400;font-size:clamp(15px,2.6vh,26px);letter-spacing:.02em}
  .mpin .plate small{font-weight:800;font-size:clamp(10px,1.5vh,14px);opacity:.8}
  .mpin:hover .plate{transform:scale(1.06);border-color:#fff}
  .mpin.edge-r .plate{position:relative;left:-3.2em} /* near the right edge: the name plate leans left so it isn't cut off */
  .mpin.on .plate{border-color:#ffd36b;box-shadow:0 0 18px rgba(255,211,107,.6)}
  .mpin.on .plate small{color:#ffd36b;opacity:1}
  .mapx{position:absolute;right:0;top:0;width:clamp(36px,5vh,52px);height:clamp(36px,5vh,52px);border-radius:50%;border:1.5px solid rgba(255,255,255,.7);
    background:rgba(8,18,36,.55);color:#fff;font-size:clamp(18px,2.6vh,26px);font-weight:900;cursor:pointer}
  #lobby .timebox,#lobby .hero,#lobby .cta,#lobby .link,.ov .card,.ov .cta,.ix{background:rgba(8,18,36,.3);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1.5px solid rgba(255,255,255,.6);box-shadow:none;color:#fff}
  #lobby .timebox label{color:#fff}
  #lobby .timebox output{background:rgba(8,18,36,.35);border:1.5px solid rgba(255,255,255,.5)}
  #lobby .hero{border-color:var(--ring)}
  /* scrollbars in the game's colours instead of the browser default */
  *{scrollbar-width:thin;scrollbar-color:#b072ff rgba(255,255,255,.1)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:rgba(255,255,255,.08);border-radius:999px}
  ::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#ff6fd0,#8b5cff);border-radius:999px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-button{display:none;height:0;width:0}
  ::-webkit-scrollbar-corner{background:transparent}
  /* how to play: one wide 16:9 window */
  .ov .card.howcard{width:min(94vw,calc(86vh * 16 / 9));max-width:none;aspect-ratio:16/9;max-height:92vh;display:grid;grid-template-columns:1fr 1.08fr;
    grid-template-rows:auto minmax(0,1fr) auto;column-gap:2.4%;row-gap:1.6vh;padding:3vh 2.6vw 2.6vh;text-align:left}
  .howcard .how-hd{grid-column:1/-1;text-align:center}
  .howcard .how-hd .h{margin:.4vh 0 0;font-size:clamp(22px,4.2vh,44px)}
  .howcard .how-l{min-height:0;overflow:auto;padding-right:1vw}
  /* every step gets an equal row, filling the column, so the numbers are evenly spaced */
  .howcard .how-l ol{margin:0;padding:0;list-style:none;counter-reset:st;display:grid;grid-auto-rows:minmax(0,1fr);height:100%;align-items:center}
  .howcard .how-l li{counter-increment:st;position:relative;padding-left:4.4vh;font-size:clamp(13px,2vh,20px);line-height:1.3}
  .howcard .how-l li::before{content:counter(st);position:absolute;left:0;top:50%;transform:translateY(-50%);width:3vh;height:3vh;border-radius:50%;display:grid;place-items:center;
    background:linear-gradient(135deg,#ff6fd0,#8b5cff);font-weight:900;font-size:1.6vh}
  .howcard .how-r{min-height:0;display:flex;flex-direction:column;gap:1.4vh}
  .how-box{border-radius:2.2vh;border:1.5px solid rgba(255,255,255,.45);background:rgba(8,18,36,.35);padding:1.6vh 1.4vw}
  .how-box .kicker{margin:0 0 1vh}
  .how-rar{display:grid;grid-template-columns:auto 1fr auto auto;gap:.7vh 1.2vw;align-items:center;font-weight:800;font-size:clamp(12px,1.9vh,19px)}
  .how-rar .nm{font-weight:900;letter-spacing:.06em;text-transform:uppercase}
  .how-rar .bar{height:.9vh;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
  .how-rar .bar i{display:block;height:100%;border-radius:inherit;background:var(--rc)}
  .how-rar .n,.how-rar .p{text-align:right;white-space:nowrap}
  .how-rar .p{opacity:.75}
  .how-weigh{flex:1;min-height:0;display:flex;align-items:center;gap:1.4vw;position:relative;overflow:hidden}
  .how-weigh svg.hw-svg{width:48%;height:auto;max-height:100%;flex:none}
  .hw-fish{transition:transform .55s cubic-bezier(.3,1.4,.5,1),opacity .25s}
  .hw-fish.up{transform:translateY(-90px);opacity:0;transition:transform .35s ease-in,opacity .25s}
  .hw-needle{transform-origin:200px 172px;transition:transform 1.1s cubic-bezier(.2,1.5,.4,1)}
  .hw-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:.6vh;overflow:hidden}
  .hw-info .kicker{margin:0}
  .hw-name{font-family:"Lilita One",Nunito,sans-serif;font-size:clamp(16px,3vh,30px);line-height:1.05}
  .hw-info .cs-rar{font-size:clamp(11px,1.7vh,17px)}
  .hw-kg{font-weight:900;font-size:clamp(14px,2.4vh,24px)}
  .hw-usd{font-family:"Lilita One",Nunito,sans-serif;font-size:clamp(22px,4.6vh,46px);color:#5dff9a;text-shadow:0 2px 12px rgba(93,255,154,.35);line-height:1}

  /* answer streak */
  /* one progress bar under the top bar: purple while answering, yellow with a shimmer from 3 right answers in a row */
  #game .meter,#game .pdots{display:none}
  .qbar{position:relative;width:min(560px,86vw);height:18px;margin:4px auto 14px;border-radius:999px;background:rgba(8,18,36,.22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    box-shadow:inset 0 2px 4px rgba(0,0,0,.35),0 0 0 1.5px rgba(255,255,255,.25)}
  .qbar-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;overflow:hidden;
    background:linear-gradient(180deg,rgba(181,123,255,.82),rgba(124,58,237,.82));box-shadow:0 0 10px rgba(139,92,255,.45);
    transition:width .6s cubic-bezier(.2,.9,.3,1.15),background .4s,box-shadow .4s}
  .qbar-fill.empty{opacity:0}
  .qbar-fill::after{content:"";position:absolute;left:10px;right:10px;top:4px;height:4px;border-radius:999px;background:rgba(255,255,255,.38)}
  .qbar.hot .qbar-fill{background:linear-gradient(180deg,rgba(255,226,90,.88),rgba(255,184,0,.88));box-shadow:0 0 14px rgba(255,200,40,.75)}
  .qbar.hot .qbar-fill::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);
    background-size:220% 100%;animation:qshine 1.4s linear infinite}
  @keyframes qshine{from{background-position:120% 0}to{background-position:-100% 0}}
  .qbar.bump .qbar-fill{animation:qflash .55s ease-out}
  @keyframes qflash{0%{filter:brightness(1.9) saturate(1.3);transform:scaleY(1.35)}100%{filter:none;transform:none}}
  /* lightning (like the video): one thick pale-yellow jagged line at a time snaps across the edge of the yellow part and pulls back */
  .qbar-bolts{position:absolute;left:0;top:-20px;bottom:-20px;width:4%;display:none;pointer-events:none;transition:width .6s cubic-bezier(.2,.9,.3,1.15)}
  .qbar.hot .qbar-bolts{display:block}
  .qbar-bolts svg{position:absolute;left:0;top:0;overflow:visible}
  .qbar-bolts polyline{fill:none;stroke:#ffe36e;stroke-linecap:round;stroke-linejoin:round}
  @media (min-width:1000px){.qbar-bolts{top:-2.6vh;bottom:-2.6vh}}
  svg.zap{position:fixed;left:0;top:0;z-index:60;pointer-events:none;overflow:visible}
  .qbar-tag{position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%);white-space:nowrap;pointer-events:none;
    font:900 13px/1 Nunito,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#ffd84a;text-shadow:0 0 8px rgba(255,190,30,.8),0 2px 0 rgba(0,0,0,.35)}
  .qbar-tag.bump{animation:qtag .6s cubic-bezier(.2,1.6,.4,1)}
  @keyframes qtag{0%{transform:translateX(-50%) scale(.4);opacity:0}60%{transform:translateX(-50%) scale(1.25);opacity:1}100%{transform:translateX(-50%) scale(1)}}
  @media (min-width:1000px){.qbar{width:min(70vh,60vw);height:2.4vh;margin:.6vh auto 1.6vh}.qbar-fill::after{top:.5vh;height:.55vh;left:1.4vh;right:1.4vh}.qbar-tag{font-size:1.8vh;bottom:calc(100% + .6vh)}}
  @media (prefers-reduced-motion:reduce){.qbar.hot .qbar-fill::before,.qbar.bump .qbar-fill,.qbar-tag.bump{animation:none}.qbar-bolts{display:none!important}}
  .pill.streak{background:linear-gradient(135deg,#ffb020,#ff5f6d);color:#fff}

  /* Gummy reacts on the painted lakes: a happy hop, or a yank toward the water */
  #breath{transform-box:fill-box;transform-origin:50% 100%}

  /* ---------- rarity reveal before the catch ---------- */

  .rreveal.open .rv-q{display:none}

  /* ---------- catch scene: why this fish ---------- */

  .cs-chip{padding:3px 9px;border-radius:999px;font-size:clamp(11px,1.6vh,15px);font-weight:900;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);color:#fff;white-space:nowrap}

  /* ---------- phone mode: join panel in the lobby (QR code + code, players who joined) ---------- */
  body.phonemode .lb-per{display:none}
  body.phonemode .heroes{display:block}
  .phjoin{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
  @media(min-width:760px){.phjoin{grid-template-columns:minmax(220px,.9fr) minmax(0,1.6fr)}}
  .phcard,.phlist{background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:20px;padding:14px}
  .phcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;min-height:200px}

  .phps{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
  .php{position:relative;background:#0a1830;border:2px solid var(--ring);border-radius:16px;padding:10px 8px;text-align:center;animation:phin .35s cubic-bezier(.2,.8,.3,1)}

  .php b{display:block;font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .ld-logo{width:min(34vw,26vh);height:auto;border-radius:22%;box-shadow:0 14px 40px rgba(0,0,0,.45);animation:ldBob 1.6s ease-in-out infinite}

  .ld-bar{position:relative;width:min(70vw,52vh);height:18px;border-radius:999px;background:rgba(8,18,36,.55);box-shadow:inset 0 2px 4px rgba(0,0,0,.4),0 0 0 1.5px rgba(255,255,255,.25);overflow:hidden}

  /* ===== catch bar: after every round each player gets one try to tap while the fish swims through the net ===== */

  .mg-row{display:flex;align-items:center;gap:1.4vw}

    background:linear-gradient(180deg,#46b8f2,#1268b8 58%,#0a3b78);box-shadow:inset 0 .6vh 1.4vh rgba(0,0,0,.3)}
  .mg-track::before{content:"";position:absolute;inset:0;opacity:.35;background:repeating-linear-gradient(100deg,transparent 0 5vh,rgba(255,255,255,.5) 5vh 5.4vh,transparent 5.4vh 11vh);animation:mgwave 6s linear infinite}
  @keyframes mgwave{to{background-position:22vh 0}}

  .mg-go{flex:none;height:9vh;padding:0 3vw;border-radius:4.5vh;border:0;cursor:pointer;color:#10213a;font-size:4.2vh;letter-spacing:.04em;

  .mg.sum .mg-nm{font-size:4.6vh;white-space:normal}
  .pcard.mg-on{border-color:var(--ring)!important;box-shadow:0 0 0 2px var(--ring),0 0 26px color-mix(in srgb,var(--ring) 55%,transparent)!important;transform:translateY(-4px)}
  /* the CATCH! button on each player's card (only the player whose turn it is can tap theirs) */

  .pcatch.ok{background:rgba(53,208,127,.22);color:#a6ffc9;border:2px solid #35d07f}

  /* ===== the catch bar in each place's own pictures (MG_ART + mgTheme set data-mgloc = lake / frost / sea and the --mg-* pictures) =====
     --mg-u: 1vh in the game, 1cqw in How to play · --mg-h: the bar's height · --mg-sl/--mg-sr: the bar picture's decorated ends in px
     of its 200 px height, --mg-kl/--mg-kr the same as a share of the height · --mg-wl/wr/wt/wb: where the water is (share of the
     height) · --mg-hole: the hole in the CATCH! ring (share of the button) */
  [data-mgloc="lake"]{--mg-hole:72%} [data-mgloc="frost"]{--mg-hole:62%} [data-mgloc="sea"]{--mg-hole:66%}
  .mg[data-mgloc="lake"]{--mg-panel:rgba(30,52,24,.52);--mg-edge:#f3d79a;--mg-sl:96;--mg-sr:96;--mg-kl:.48;--mg-kr:.48;--mg-wl:.42;--mg-wr:.42;--mg-wt:.33;--mg-wb:.22}
  .mg[data-mgloc="frost"]{--mg-panel:rgba(18,40,72,.52);--mg-edge:#e2f6ff;--mg-sl:124;--mg-sr:124;--mg-kl:.62;--mg-kr:.62;--mg-wl:.56;--mg-wr:.56;--mg-wt:.29;--mg-wb:.16}
  .mg[data-mgloc="sea"]{--mg-panel:rgba(4,46,64,.52);--mg-edge:#ffd77a;--mg-sl:150;--mg-sr:180;--mg-kl:.75;--mg-kr:.9;--mg-wl:.62;--mg-wr:.72;--mg-wt:.37;--mg-wb:.16}
  .mg[data-mgloc]{--mg-u:1vh;--mg-h:14vh;isolation:isolate;background:var(--mg-panel);border-color:var(--mg-edge)}
  .mg[data-mgloc]::before,.mg[data-mgloc]::after{content:"";position:absolute;z-index:-1;top:calc(var(--mg-u)*-3.6);width:calc(var(--mg-u)*9.5);height:calc(var(--mg-u)*9.5);
    background:var(--mg-deco) left top/contain no-repeat;pointer-events:none;filter:drop-shadow(0 calc(var(--mg-u)*.6) calc(var(--mg-u)*.8) rgba(0,0,0,.35))}
  .mg[data-mgloc]::before{left:calc(var(--mg-u)*-3.6)} .mg[data-mgloc]::after{right:calc(var(--mg-u)*-3.6);transform:scaleX(-1)}
  .mg[data-mgloc] .mg-track{height:var(--mg-h);overflow:visible;border:0 solid transparent;border-radius:0;background:none;box-shadow:none;
    border-image-source:var(--mg-bar);border-image-slice:0 var(--mg-sr) 0 var(--mg-sl) fill;border-image-repeat:stretch;
    border-image-width:0 calc(var(--mg-h)*var(--mg-kr)) 0 calc(var(--mg-h)*var(--mg-kl));filter:drop-shadow(0 calc(var(--mg-u)*.5) calc(var(--mg-u)*.8) rgba(0,0,0,.3))}
  .mg[data-mgloc] .mg-track::before{display:none}
  .mg[data-mgloc] .mg-lane{left:calc(var(--mg-h)*var(--mg-wl));right:calc(var(--mg-h)*var(--mg-wr));top:calc(var(--mg-h)*var(--mg-wt));bottom:calc(var(--mg-h)*var(--mg-wb))}
  .mg[data-mgloc] .mg-net{top:0;bottom:0;border:0;border-radius:0;box-shadow:none;background:var(--mg-net) left center/auto 160% repeat-x rgba(6,48,72,.2);transition:filter .1s,background-color .1s}
  .mg[data-mgloc] .mg-net.in{background-color:rgba(255,255,255,.34);box-shadow:none;filter:drop-shadow(0 0 calc(var(--mg-u)*.9) #fff) brightness(1.15)}
  .mg[data-mgloc] .mg-post{display:block;position:absolute;top:calc(var(--mg-u)*-2.6);bottom:calc(var(--mg-u)*-1.8);left:0;width:calc(var(--mg-u)*3);transform:translateX(-50%);
    background:var(--mg-post) center bottom/contain no-repeat;pointer-events:none}
  .mg[data-mgloc] .mg-post.r{left:auto;right:0;transform:translateX(50%) scaleX(-1)}
  .mg[data-mgloc] .mg-fish{width:calc(var(--mg-u)*8.4);height:calc(var(--mg-u)*6.4);margin:calc(var(--mg-u)*-3.2) 0 0 calc(var(--mg-u)*-4.2)}
  .mg[data-mgloc] .mg-fl svg{display:none}
  .mg[data-mgloc] .mg-fi{display:block;width:100%;height:100%;background:var(--mg-fish) center/contain no-repeat;filter:drop-shadow(0 .4vh .5vh rgba(0,0,0,.35));animation:mgbob .45s ease-in-out infinite alternate}
  .mg[data-mgloc] .mg-fish.got .mg-fi,.mg[data-mgloc] .mg-fish.flee .mg-fi{animation:none}
  .mg-demo[data-mgloc]{--mg-u:1cqw;--mg-h:12cqw}
  /* round CATCH! button: the place's ring around a dome in the player's colour (grey while waiting, green / red once tried) */
  .players[data-mgloc] .pcatch,.mg-demo[data-mgloc] .mg-go{--d:var(--dome,var(--ring));border:0;border-radius:50%;box-shadow:none;color:#fff;paint-order:stroke fill;
    background:var(--mg-button) center/100% 100% no-repeat,
      radial-gradient(ellipse 36% 22% at 50% 27%,rgba(255,255,255,.62),transparent) center/var(--mg-hole) var(--mg-hole) no-repeat,
      radial-gradient(circle closest-side,color-mix(in srgb,var(--d) 72%,#fff) 0,var(--d) 52%,color-mix(in srgb,var(--d) 58%,#000) 96%,transparent 100%) center/var(--mg-hole) var(--mg-hole) no-repeat}
  .players[data-mgloc] .pcatch{width:min(100%,24vh);height:auto;aspect-ratio:1;min-height:0;max-height:none;flex:none;align-self:center;margin:auto;padding:0;
    font-size:min(3.6vh,2.4vw);-webkit-text-stroke:.45vh #10213a;text-shadow:0 .5vh 0 #10213a;filter:drop-shadow(0 .8vh 1vh rgba(0,0,0,.35))}
  .players[data-mgloc="frost"] .pcatch{font-size:min(3.1vh,2.1vw)}

  .mg-demo[data-mgloc] .mg-go{width:13cqw;height:13cqw;aspect-ratio:1;padding:0;font-size:2.3cqw;-webkit-text-stroke:.3cqw #10213a;text-shadow:0 .35cqw 0 #10213a}
  .mg-demo[data-mgloc] .mg-go:active{transform:translateY(.4cqw) scale(.97);box-shadow:none}
  @media (max-width:999px){.mg{bottom:auto;top:12vh;width:94vw;padding:1.2vh 3vw 1.4vh}.mg-go{padding:0 4vw;font-size:3vh}.mg-nm{font-size:3vh}.mg-hint{font-size:1.8vh}.mg-team i{width:3.6vh;height:3.6vh}.mg-top{gap:2.4vw}}
  @media (max-width:600px){.mg-row{flex-direction:column;align-items:stretch;gap:1.2vh}.mg-go{height:6.4vh}.mg-team{display:none}}
  @media (prefers-reduced-motion:reduce){.mg-fl svg,.mg-track::before{animation:none}}
  /* the catch bar in How to play (a live demo on the place's picture) */
  .ht-demo{background-size:cover;background-position:center;display:grid;place-items:center}

<body>
<div class="loader" id="loader" role="progressbar" aria-label="Loading the game" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
  <img class="ld-logo" src="icon-512.png" alt="">
  <div class="ld-t">Loading&hellip;</div>
  <div class="ld-bar"><i id="ldFill"></i></div>
  <div class="ld-n" id="ldN">0%</div>
  <p class="ld-tip"><b>TIP:</b> First time download might take longer than usual.</p>
</div>

<!-- ============ LOBBY ============ -->
<div class="screen" id="lobby">
  <button class="bankbtn" id="bankBtn" aria-label="Bank balance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2.4" fill="currentColor" fill-opacity=".18"/><circle cx="12" cy="12" r="2.8"/><path d="M5.5 9.5v5M18.5 9.5v5"/></svg><span id="bankAmt">$0</span></button>
  <div class="lobbybg" id="lobbyBg" aria-hidden="true"></div>
  <div class="minimap" id="miniMap">
    <button class="mm-win" id="mapBtn" aria-label="Open the map" title="Open the map"><div class="mm-zoom" id="mmZoom"><div class="mm-world" id="mmWorld"><img src="art/map.webp?v=1" alt=""></div></div><span class="mm-tag">MAP</span></button>
    <div class="mm-bar">
      <button class="mm-arrow" id="mmPrev" aria-label="Previous location"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="mm-name" id="mapSub" aria-live="polite"></div>
      <button class="mm-arrow" id="mmNext" aria-label="Next location"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </div>
  <div class="lobby-fit" id="lobbyFit">
  <div class="logo">

    <img class="title-img" id="titleImg" src="art/title.webp" alt="Gummy the Fisherman" width="1200" height="454">
  </div>
  <div class="loctext" id="locName" aria-label="Location"></div>
  <div class="tagline">Complete the sentence with the right word. Help Gummy land the big one!</div>
  <div class="lobbar">
    <div class="timebox">
      <label>ANSWER TIME</label>
      <input type="range" id="timeRange" min="6" max="25" step="1" value="12">
      <output id="timeOut">12s</output>
    </div>
    <div class="lb lb-seg" id="playSeg" role="group" aria-label="Team, solo or 6 players">
      <button data-lbplay="team" title="Team: one fish per round for the whole team"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7.5" r="3"/><path d="M6.5 19.5v-1a5.5 5.5 0 0 1 11 0v1"/><circle cx="4.8" cy="10" r="2.2"/><path d="M1.5 18.5v-.6a3.6 3.6 0 0 1 4.6-3.5"/><circle cx="19.2" cy="10" r="2.2"/><path d="M22.5 18.5v-.6a3.6 3.6 0 0 0-4.6-3.5"/></svg><span class="seg-t">Team</span></button>
      <button data-lbplay="solo" title="Solo: every player catches their own fish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20.5v-1.2a7 7 0 0 1 14 0v1.2"/></svg><span class="seg-t">Solo</span></button>

    </div>
    <div class="lb lb-mode" id="modePick">
      <button id="modeCur" aria-haspopup="true"><span class="lb-k">Mode</span><span class="cur" id="modeName"></span><svg class="car" viewBox="0 0 12 8" width="12" height="8"><path d="M1.5 1.5 6 6l4.5-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

    </div>

  </div>
  <div class="heroes" id="heroes"></div>

    if (br) { const r = RODS.find((x) => x.id === br.dataset.buyrod); if (bank.usd >= r.price && !gear.rods.includes(r.id)) { bank.usd -= r.price; gear.rods.push(r.id); store.set('gummyBank', bank); saveGear(); renderBank(); sfx.coin(); } return again(); }
    if (bb) { const b = BAITS.find((x) => x.id === bb.dataset.buybait); if (bank.usd >= b.price) { bank.usd -= b.price; gear.baits[b.id] = (gear.baits[b.id] || 0) + 1; if (!gear.armed) gear.armed = b.id; store.set('gummyBank', bank); saveGear(); renderBank(); sfx.coin(); } return again(); }
    if (arm) { gear.armed = gear.armed === arm.dataset.arm ? null : arm.dataset.arm; saveGear(); return again(); }
    close(e);
  };
}

// unlocks everything reached so far; returns what's new as [{a, lvl}]
function checkAchievements() {
  const fresh = [];
  ACH.forEach((a) => {
    const v = a.val(), lvl = a.goals.filter((g) => v >= g).length, had = achieved[a.id] || 0;
    if (lvl > had) { achieved[a.id] = lvl; fresh.push({a, lvl}); }
  });
  if (fresh.length) store.set('gummyAch', achieved);
  return fresh;
}
// bank bar: $0 → $100K, milestones spaced out so the small ones don't pile up at the start
function barPos(usd) {
  const pts = [[0, 0], ...ACH.filter((a) => a.bar).map((a) => [a.goals[0], a.bar])];
  for (let i = 1; i < pts.length; i++) {
    const [u0, p0] = pts[i - 1], [u1, p1] = pts[i];
    if (usd <= u1) return p0 + (p1 - p0) * (usd - u0) / (u1 - u0);
  }
  return 1;
}
const shortUsd = (n) => n >= 1000 ? '$' + n / 1000 + 'K' : '$' + n;

  return `<div class="bk-prog">
    <div class="bk-bar"><div class="bk-track"><div class="bk-fill" style="width:${(barPos(bank.total) * 100).toFixed(2)}%"></div></div>

}

/* ================= PHONE MODE (host) =================
   Settings → Phone mode: instead of the 4 hero cards the lobby shows a QR code + 6-digit code.
   Players open the mobile app (gummy-fisherman-mobile), join with the code, pick a name and a picture,
   and answer their turns on the phone; this screen stays the big shared screen (Kahoot style).
   Connection: PeerJS (WebRTC data channels; the free PeerJS cloud server only introduces the
   devices), this game is the hub at peer id "fugio-gummy-<code>". */
const PH_PREFIX = 'fugio-gummy-', PH_MAX = 8;
const PH_JOIN_URL = new URL('../gummy-fisherman-mobile/', location.href).href;
const PH = {peer: null, code: '', players: [], status: 'off', libs: null}; // players: {id, name, av, conn}
function phLoad(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
function phLibs() {
  return PH.libs || (PH.libs = Promise.all([
    window.Peer ? 0 : phLoad('https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'),
    window.qrcode ? 0 : phLoad('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js'),
  ]));
}
const phCode = () => String(Math.floor(100000 + Math.random() * 900000));
async function phOpen() {
  if (PH.peer && !PH.peer.destroyed) return;
  PH.status = 'connecting'; renderPhoneLobby();
  try { await phLibs(); } catch (e) { PH.status = 'error'; PH.libs = null; renderPhoneLobby(); return; }
  if (!phoneMode) return;
  PH.code = phCode();
  const peer = new Peer(PH_PREFIX + PH.code);
  PH.peer = peer;
  peer.on('open', () => { if (PH.peer === peer) { PH.status = 'ready'; renderPhoneLobby(); } });
  peer.on('connection', phConn);
  peer.on('disconnected', () => { if (PH.peer === peer && !peer.destroyed) peer.reconnect(); });
  peer.on('error', (err) => {
    if (PH.peer !== peer) return;
    if (err.type === 'unavailable-id') { peer.destroy(); PH.peer = null; phOpen(); return; } // code taken: new code
    if (['network', 'server-error', 'socket-error', 'socket-closed', 'browser-incompatible'].includes(err.type)) { PH.status = 'error'; renderPhoneLobby(); }
  });
}
function phClose() {
  PH.players.forEach((p) => { try { p.conn?.send({t: 'bye'}); } catch (e) {} });
  if (PH.peer) PH.peer.destroy();
  PH.peer = null; PH.players = []; PH.status = 'off'; PH.code = '';
}
function phSend(p, msg) { try { if (p?.conn?.open) p.conn.send(msg); } catch (e) {} }
function phAll(msg) { PH.players.forEach((p) => phSend(p, msg)); }
const phTaken = (name, id) => PH.players.some((p) => p.id !== id && p.name.toLowerCase() === name.toLowerCase());
function phConn(conn) {
  conn.on('data', (m) => {
    if (!m || typeof m !== 'object') return;
    if (m.t === 'hello') { conn.send({t: 'hello', ok: true, started: !!(G && G.phone), names: PH.players.map((p) => p.name)}); return; }
    if (m.t === 'join') {
      const id = String(m.token || '').slice(0, 40), name = String(m.name || '').trim().replace(/\s+/g, ' ').slice(0, 14);
      const av = clamp(+m.av | 0, 0, HEROES.length - 1);
      let p = PH.players.find((x) => x.id === id);
      if (!p) {
        if (G && G.phone) return conn.send({t: 'err', msg: 'This game has already started. Wait for the next one!'});
        if (!name) return conn.send({t: 'err', msg: 'Type your name.'});
        if (phTaken(name, id)) return conn.send({t: 'err', msg: `"${name}" is already playing. Pick another name.`, field: 'name'});
        if (PH.players.length >= PH_MAX) return conn.send({t: 'err', msg: `The game is full (${PH_MAX} players).`});
        p = {id, name, av}; PH.players.push(p);
      } else if (!(G && G.phone)) { // same phone again (reload / back): may change name and picture in the lobby
        if (name && !phTaken(name, id)) p.name = name;
        p.av = av;
      }
      if (p.conn && p.conn !== conn) { try { p.conn.close(); } catch (e) {} }
      p.conn = conn; conn.ph = p;
      conn.send({t: 'joined', name: p.name, av: p.av});
      phSync(p); renderPhoneLobby();
      return;
    }
    if (m.t === 'ans') phAnswer(conn.ph, m);
    if (m.t === 'leave' && conn.ph && !(G && G.phone)) { PH.players = PH.players.filter((x) => x !== conn.ph); renderPhoneLobby(); }
  });
  conn.on('close', () => { if (conn.ph && conn.ph.conn === conn) { conn.ph.conn = null; renderPhoneLobby(); } });
}
// tell one phone what is happening right now (after joining or reconnecting)
function phSync(p) {
  if (!G || !G.phone) return phSend(p, {t: 'lobby'});
  const T = G.phTurn;
  if (T && !G.busy && G.players[T.pi].phone === p.id) return phSend(p, T.msg);
  phSend(p, G.phWatch || {t: 'watch', msg: 'Look at the big screen!'});
}
function phWatch(msg) { if (!G || !G.phone) return; G.phWatch = {t: 'watch', msg}; G.phTurn = null; phAll(G.phWatch); }
// nextTurn: the player whose turn it is gets the question, everyone else waits
function phTurn(pi, words, q, secs, kind) {
  if (!G || !G.phone) return;
  const p = G.players[pi], id = (G.phTurnId || 0) + 1; G.phTurnId = id;
  const msg = {t: 'turn', id, kind, secs, hint: q.querySelector('.qhint')?.textContent || '', words: words.map((w) => w.text),
    before: kind === 'fill' ? words.sentence.before : '', after: kind === 'fill' ? words.sentence.after : '', round: G.level + 1};
  G.phTurn = {id, pi, words, q, msg};
  G.phWatch = {t: 'wait', who: p.name, av: p.av, round: G.level + 1};
  PH.players.forEach((x) => phSend(x, x.id === p.phone ? msg : G.phWatch));
}
function phAnswer(pp, m) {
  const T = G && G.phTurn;
  if (!pp || !T || m.id !== T.id || G.busy || G.paused || !$('ov').hidden) return;
  if (G.players[T.pi].phone !== pp.id || G.turns[G.turn] !== T.pi) return;
  const i = +m.i; if (!(i >= 0 && i < T.words.length)) return;
  answer(T.pi, T.words, i, T.q);
}
// answer(): the phone shows right / wrong and the correct answer
function phResult(pi, idx, ok, w) {
  if (!G || !G.phone) return;
  const T = G.phTurn, p = G.players[pi], pp = PH.players.find((x) => x.id === p.phone);
  phSend(pp, {t: 'res', id: T?.id, ok, timeout: idx < 0, kind: G.mode, wrong: G.mode === 'word' ? w.text : '', right: w.fix || w.text});
  G.phTurn = null;
  const waitMsg = {t: 'wait', who: p.name, av: p.av, round: G.level + 1, done: true};
  G.phWatch = waitMsg;
  PH.players.forEach((x) => { if (x !== pp) phSend(x, waitMsg); });
}
function phPlayers() {
  return PH.players.map((p) => ({...HEROES[p.av], name: p.name, charId: 'ph-' + p.name.toLowerCase(), on: true, phone: p.id}));
}
function setPhoneMode(on) {
  phoneMode = on; saveLobby();
  if (!on) phClose();
  renderLobby();
}
const phCodeTxt = () => PH.code ? PH.code.slice(0, 3) + ' ' + PH.code.slice(3) : '';
function phQr() {
  if (!window.qrcode || !PH.code) return '';
  const qr = qrcode(0, 'M'); qr.addData(PH_JOIN_URL + '?join=' + PH.code); qr.make();
  return qr.createSvgTag({cellSize: 6, margin: 2, scalable: true});
}
function renderPhoneLobby() {
  document.body.classList.toggle('phonemode', phoneMode);
  if (!phoneMode || $('lobby').hidden) { phStartBtn(); return; }
  const box = $('heroes');
  const st = PH.status;
  const left = st === 'ready'
    ? `<div class="phq">${phQr()}</div><div class="phc"><small>GAME CODE</small><b>${phCodeTxt()}</b></div>
       <div class="phhow">On a phone: open <b>Gummy the Fisherman</b> &rarr; <b>Join by code</b>, or scan the QR code.</div>`
    : st === 'error'
      ? `<div class="pherr">Could not open the game for phones. Check the internet connection.<button class="cta h" data-phretry>Try again</button></div>`
      : `<div class="phload"><i></i>Opening the game for phones…</div>`;
  const cards = PH.players.map((p, i) => { const h = HEROES[p.av]; return `
    <div class="php ${p.conn ? '' : 'away'}" style="--ring:${h.ring}"><button class="phx" data-phkick="${i}" aria-label="Remove ${esc(p.name)}">&times;</button>
      <img src="${h.art}" alt=""><b>${esc(p.name)}</b><small>${p.conn ? 'Ready to fish' : 'Reconnecting…'}</small></div>`; }).join('');
  box.innerHTML = `<div class="phjoin"><div class="phcard">${left}</div>
    <div class="phlist"><div class="phlist-h">Players <span>${PH.players.length}/${PH_MAX}</span></div>
      <div class="phps">${cards || '<div class="phempty">Waiting for players to join…</div>'}</div></div></div>`;
  phStartBtn();
}
function phStartBtn() {
  const b = $('startBtn'), off = phoneMode && !PH.players.length;
  b.classList.toggle('waiting', off);
  b.innerHTML = off ? 'Waiting for players&hellip;' : 'Start fishing';
}
$('heroes').addEventListener('click', (e) => {
  if (!phoneMode) return;
  e.stopPropagation(); // the hero-card handlers below are for the normal lineup
  if (e.target.closest('[data-phretry]')) { PH.peer?.destroy(); PH.peer = null; phOpen(); return; }
  const k = e.target.closest('[data-phkick]'); if (!k) return;
  const p = PH.players[+k.dataset.phkick]; if (!p) return;
  phSend(p, {t: 'kicked'}); PH.players.splice(+k.dataset.phkick, 1); renderPhoneLobby();
}, true);

    rings: [['r', 580, 32, 440, 156], [800, 368, 330, 64], [366, 744, 140, 86]],

  {fish: true, title: `Fish of ${l.name}`, text: `Every place has its own fish. These ${FISH.filter((f) => FISH_LOC[f[0]] === l.id).length} live only at ${l.name}: travel to the other places to fill your whole Fish Index!`},

const htPct = (v, of) => (v / of * 100).toFixed(3) + '%';
function htCurve(a, b) {
  const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, dx = b[0] - a[0], dy = b[1] - a[1], k = .18; // bend sideways a little
  return `M${a[0]} ${a[1]} Q${(mx - dy * k).toFixed(1)} ${(my + dx * k).toFixed(1)} ${b[0]} ${b[1]}`;
}
function htRing(r, i) {
  const d = `style="--d:${(.15 + i * .12).toFixed(2)}s"`;
  return r[0] === 'r' ? `<rect class="ht-ring" ${d} pathLength="1" x="${r[1]}" y="${r[2]}" width="${r[3]}" height="${r[4]}" rx="26"/>`
    : `<ellipse class="ht-ring" ${d} pathLength="1" cx="${r[0]}" cy="${r[1]}" rx="${r[2]}" ry="${r[3]}"/>`;
}
function htShot(s, l) {
  const src = s.img === 'weigh' ? 'art/howto/weigh.webp' : `art/howto/${l.id}-${s.img}.webp`;
  const svg = `<svg class="ht-marks" viewBox="0 0 ${HT_W} ${HT_H}" aria-hidden="true"><defs><marker id="ht-head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10 2.5 5z" fill="var(--ring)"/></marker></defs>${
    s.rings.map(htRing).join('')}${s.notes.map((o, i) => `<path class="ht-arrow" style="--d:${(.5 + i * .25).toFixed(2)}s" pathLength="1" d="${htCurve(o.from, o.to)}" marker-end="url(#ht-head)"/>`).join('')}</svg>`;
  const notes = s.notes.map((o, i) => `<span class="ht-note" style="left:${htPct(o.at[0], HT_W)};top:${htPct(o.at[1], HT_H)};--d:${(.45 + i * .25).toFixed(2)}s"><b>${String.fromCharCode(65 + i)}</b>${esc(o.t)}</span>`).join('');
  return `<figure class="ht-shot"><img src="${src}" alt="Game screenshot: ${esc(s.title)}">${svg}${notes}</figure>`;
}
// the last step: every fish of the location; the ones you've caught in colour, the rest as shadows. Tap one to see its name.
function htFish(l) {
  const list = FISH.filter((f) => FISH_LOC[f[0]] === l.id), got = list.filter((f) => fishIndex[f[0]]).length;
  return `<figure class="ht-shot ht-fishbox" style="background-image:url(${lobbyPic(l)})"><div class="ht-fishgrid" style="--n:${Math.ceil(Math.sqrt(list.length * 1.9))}">${
    list.map((f, i) => `<button type="button" class="ht-f ${fishIndex[f[0]] ? 'got' : ''}" style="--rc:${RARITY[f[1]].color};--d:${(i * .018).toFixed(3)}s" data-fname="${esc(fishIndex[f[0]] ? f[0] : '???')}"><img src="${f[5]}" alt="" loading="lazy"></button>`).join('')
  }</div><div class="ht-fishbar"><b class="ht-fishname">Tap a fish</b><span>${got} / ${list.length} caught here</span></div></figure>`;
}
// How to play: a working catch bar on this place's picture. Tap it to try; a big, a middle and a small net take turns
function htDemo(l) {
  const ring = (HT_THEME[l.id] || HT_THEME.lake).ring;
  return `<figure class="ht-shot ht-demo" style="background-image:url(${lobbyPic(l)})"><div class="mg mg-demo" style="--ring:${ring}">
    <div class="mg-top"><div class="mg-who"><div class="mg-nm">Try it!</div><div class="mg-hint">Better answers = a bigger net. In the game the CATCH! button is on your card.</div></div></div>
    <div class="mg-row">${mgHtml()}<button class="mg-go h" type="button">CATCH!</button></div></div></figure>`;
}
function htDemoRun(fig) {
  if (!fig) return;
  const box = fig.querySelector('.mg'), nets = [.3, .2, .12];
  let k = 0, cur = null;
  box.addEventListener('pointerdown', (e) => { if (e.button > 0) return; e.preventDefault(); cur?.tap(e); });
  (async () => {
    while (fig.isConnected) {
      const net = nets[k++ % nets.length];
      cur = mgBar(box, {net, at: .05 + Math.random() * (.9 - net), cross: MG.CROSS[0] * 1000, ready: 300, alive: () => fig.isConnected});
      const r = await cur.promise; cur = null;
      if (r === null) return;
      if (r) sfx.net(); else sfx.wrong();
      await wait(1400);
    }
  })();
}
function showHow() {
  const l = locNow(), th = HT_THEME[l.id] || HT_THEME.lake, steps = htSteps(l);
  steps.forEach((s) => { if (s.img) new Image().src = s.img === 'weigh' ? 'art/howto/weigh.webp' : `art/howto/${l.id}-${s.img}.webp`; });
  const el = document.createElement('div'); el.className = 'howto';
  Object.entries(th).forEach(([k, v]) => el.style.setProperty('--' + k, v));
  el.innerHTML = `<div class="ht-in"><header class="ht-head"><h1 class="h">HOW TO PLAY</h1><span class="ht-loc">${esc(l.name)}</span>
    <nav class="ht-dots" aria-label="Steps">${steps.map((s, i) => `<button type="button" data-go="${i}" aria-label="Step ${i + 1}: ${esc(s.title)}">${i + 1}</button>`).join('')}</nav>
    <button type="button" class="ht-x" data-act="close" aria-label="Close">&times;</button></header>
    <div class="ht-body"><div class="ht-stage"></div><aside class="ht-side"><span class="ht-tag">STEP <b class="ht-n"></b> / ${steps.length}</span>
      <h2 class="h ht-title"></h2><p class="ht-text"></p>
      <div class="ht-nav"><button type="button" class="ht-prev" data-act="prev">&larr; Back</button><button type="button" class="ht-next" data-act="next"></button></div></aside></div></div>`;
  document.body.appendChild(el);
  const stage = el.querySelector('.ht-stage');
  let cur = 0;
  const show = (i) => {
    cur = clamp(i, 0, steps.length - 1);
    const s = steps[cur];
    stage.innerHTML = s.fish ? htFish(l) : s.demo ? htDemo(l) : htShot(s, l);
    if (s.demo) { mgTheme(stage.querySelector('.ht-demo .mg'), l.id); htDemoRun(stage.querySelector('.ht-demo')); }
    el.querySelector('.ht-n').textContent = cur + 1;
    el.querySelector('.ht-title').textContent = s.title;
    el.querySelector('.ht-text').textContent = s.text;
    el.querySelector('.ht-prev').disabled = cur === 0;
    el.querySelector('.ht-next').textContent = cur === steps.length - 1 ? "Got it. Let's fish!" : 'Next →';
    el.querySelectorAll('[data-go]').forEach((b, k) => { b.classList.toggle('on', k === cur); b.classList.toggle('seen', k < cur); b.setAttribute('aria-current', k === cur ? 'step' : 'false'); });
    sfx.tick();
  };
  const close = () => { el.remove(); removeEventListener('keydown', key); };
  const next = () => { if (cur === steps.length - 1) close(); else show(cur + 1); };
  const key = (e) => {
    if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); show(cur - 1); }
    else if (e.key === 'Escape') close();
  };
  addEventListener('keydown', key);
  el.addEventListener('click', (e) => {
    const go = e.target.closest('[data-go]'), act = e.target.closest('[data-act]'), f = e.target.closest('.ht-f');
    if (go) show(+go.dataset.go);
    else if (act) ({prev: () => show(cur - 1), next, close})[act.dataset.act]();
    else if (f) {
      el.querySelectorAll('.ht-f.on').forEach((b) => b.classList.remove('on')); f.classList.add('on');
      el.querySelector('.ht-fishname').textContent = f.dataset.fname === '???' ? '??? Not caught yet' : f.dataset.fname;
      sfx.pop(0);
    } else if (e.target === el) close();
  });
  show(0);
}
/* ================= OVERLAY ================= */
function openOverlay(html) {
  const ov = $('ov'); ov.innerHTML = html; ov.hidden = false;
  return new Promise((res) => {
    ov.onclick = (e) => { const b = e.target.closest('[data-close],[data-go]'); if (!b) return; ov.hidden = true; ov.innerHTML = ''; res(b.dataset.go || true); };
  });

async function answer(pi, words, idx, q) {
  G.busy = true; cancelAnimationFrame(G.timer);
  const me = G, {sentence} = G.cur;
  const ok = idx >= 0 && words[idx].wrong;
  // keep what was asked and what was tapped, for "Review answers" after the game
  const entry = {mode: G.mode, pick: idx, ok, items: words.map((x) => ({text: x.text, target: !!x.wrong, fix: x.fix}))};
  if (G.mode === 'fill') { entry.before = words.sentence.before; entry.after = words.sentence.after; }
  entry.lesson = ruleHtml(sentence); // shown in Review answers after the game
  G.players[pi].log[G.level].push(entry);
  const btns = q.querySelectorAll('.word');
  btns.forEach((b) => (b.disabled = true));
  const wi = words.findIndex((w) => w.wrong);
  if (ok) btns[idx].classList.add('right');
  else { if (idx >= 0) btns[idx].classList.add('wrong'); btns[wi].classList.add('reveal'); }
  const w = words[wi], fm = G.mode === 'fill';

    const gap = q.querySelector('.fsent .gap'); if (gap) { gap.textContent = w.text; gap.classList.add('done'); }
    w.fix = w.text; w.bad = idx >= 0 && !ok ? words[idx].text : '?';
  }
  phResult(pi, idx, ok, w);
  const p = G.players[pi];
  p.results[G.level].push(ok);
  // speed: 1 = instant, 0 = ran out of time (scored out of 10 on the catch screen)
  const limit = G.turnSecs || answerTime;
  const secs = Math.min(limit, (performance.now() - G.turnStart) / 1000);
  p.speed[G.level].push(idx < 0 ? 0 : clamp(1 - secs / limit, 0, 1));
  p.times[G.level].push(secs);
  G.turnResults.push(ok);
  const st = G.levelStats[G.level]; st.t++; if (ok) st.c++;
  G.streak = ok ? G.streak + 1 : 0; G.bestStreak[G.level] = Math.max(G.bestStreak[G.level], G.streak); renderStreak();
  // this answer's kilos for the fish come only from this player: right/wrong, how fast, and their OWN streak
  // (a team mate's good run no longer adds kilos to someone else's answer)
  p.streak = ok ? p.streak + 1 : 0;
  p.kgs[G.level].push(answerKg(ok, p.speed[G.level][p.speed[G.level].length - 1], p.streak));
  // fish depth: more right answers bring it closer to the surface
  const n = G.turns.length, wrong = st.t - st.c;

  const at = idx >= 0 ? btns[idx].getBoundingClientRect() : null;
  if (ok) { sfx.right(G.streak); confetti(at, p.ring); }
  else { sfx.wrong(); if (at) wrongPulse(at); }
  const photo = LEVELS[G.level].photo; // painted levels: Gummy just keeps breathing, no reel/tug
  if (!photo) setMood(ok ? 'reel' : 'tug');
  else fight(ok); // Glimmerwater round 1: Gummy yanks it up / gets dragged forward
  // the player's card keeps a one-line recap while everyone else plays on
  p.last = ok ? `<span class="w ok">${esc(G.mode === 'sentence' || fm ? w.fix : words[idx].text)}</span>`
    : `<span class="w no">${esc(w.bad)}</span><span class="arr">&rarr;</span><span class="w ok">${esc(w.fix)}</span>`;
  const card = $('pc' + pi);
  const dots = card.querySelectorAll('.pdots i');
  const k = p.results[G.level].length - 1; if (dots[k]) dots[k].className = ok ? 'ok' : 'no';
  const last = card.querySelector('.plast'); last.innerHTML = p.last;
  last.className = 'plast ' + (ok ? 'is-ok' : 'is-no');
  card.classList.add('has-last');
  G.turn++; renderMeter();

// minimal confetti burst from the tapped word

      {transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy + 40}px)) rotate(${(Math.random() * 540 - 270) | 0}deg) scale(.6)`, opacity: 0},
    ], {duration: 750 + Math.random() * 250, easing: 'cubic-bezier(.2,.7,.4,1)'}).onfinish = () => d.remove();

// what a catch sells for: rarity price × size (lightest of its kind 1×, heaviest 1.5×)

// rolls this round's fish and adds them to the catches + fish index.

function catchRound(lv) {
  G.landed[lv] = true;

  // round 3 only, Team and 6p only (Solo has no Gold Fish): 70 % chance the team's fish is the Gold Fish
  const goldHit = lv === 2 && G.play !== 'solo' && !G.bonus && Math.random() < GOLD_CHANCE;
  const hits = G.mg && G.mg[lv]; // the catch bar's tries this round (none in phone mode)
  const roll = (acc, c, t, pi, ids, kgs, net) => {

    // Without the catch bar (phone mode): every answer wrong = junk, as before
    const junk = net ? !net.hits : t > 0 && c === 0;

    const ct = {fish: f, level: lv, acc, c, t, kg, usd: Math.round(fishValue(f, kg, lv, acc) * mult), pi, bonus, net};

const RANKS_OF = Object.keys(RARITY);

async function finishGame(ok) {

  G.finishing = true; G.busy = true; cancelAnimationFrame(G.timer);
  phWatch('Gummy is landing the fish! Look at the big screen.');

  const st = G.levelStats[lv], turnsPerLevel = G.players.length * 2;

    while (p.results[lv].length < 2) { p.log[lv].push({skipped: true, ok}); p.results[lv].push(ok); p.speed[lv].push(ok ? .8 : 0); p.times[lv].push(ok ? answerTime * .2 : answerTime);
      p.streak = ok ? p.streak + 1 : 0; p.kgs[lv].push(answerKg(ok, ok ? .8 : 0, p.streak)); } // the skipped answers weigh like real ones
  });

/* ================= CATCH BAR: the minigame after every round ================= */

    end = hy - ((ox + 8) / 216 * L - px);

    return `<svg class="ca-bg" viewBox="${vb}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">

    const own = G.players.map((p) => (p.kgs[c.level] || []).reduce((a, b) => a + b, 0)), all = own.reduce((a, b) => a + b, 0);
    return sum + (all ? c.kg * own[pi] / all : 0);

}

  const dot = `<span class="rv-dot ${e.ok ? 'ok' : 'no'}">${k + 1}</span>`;

  const late = e.pick < 0 ? '<span class="rv-note">&#9203; Time ran out</span>' : '';
  const picked = (i) => (i === e.pick ? '<em>PICKED</em>' : '');
  let body = '';

    body = e.items.map((it, i) => `<div class="rv-opt ${it.target ? 'g' : 'r'}">${esc(it.text)}${picked(i)}</div>`).join('');
  } else if (e.mode === 'fill') {

        doc.setFont('helvetica', p.bold ? 'bold' : bold ? 'bold' : 'normal');

        if (p.under) { doc.setDrawColor(...(p.c || C.ink)); doc.setLineWidth(.3); doc.line(x, y + .9, x + ww, y + .9); }
        x += ww;
      });

    color(C.muted); doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.text('GUMMY THE FISHERMAN  -  ANSWER REVIEW', M, y); doc.text(t(date), W - M, y, {align: 'right'}); y += 9;
    color(C.ink); doc.setFontSize(22); doc.text(t(p.name), M, y); y += 7;
    color(C.muted); doc.setFont('helvetica', 'normal'); doc.setFontSize(11);
    doc.text(t(`${right} of ${asked} right  -  score ${score}/${LEVELS.length * 10}  -  ${fmtNum(ptsOf(G.players.indexOf(p)))} points  -  ${MODES[G.mode].name}  -  ${PLAYS[G.play].name}`), M, y); y += 4;
    doc.setDrawColor(...C.line); doc.setLineWidth(.5); doc.line(M, y, W - M, y); y += 7;

      doc.setFillColor(...C.band); doc.roundedRect(M, y - 5, maxW, 8, 2, 2, 'F');
      color(C.ink); doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.text(t(`Round ${lv + 1}  -  ${L.name}`), M + 3, y + .6);
      const rr = p.results[lv].filter(Boolean).length;
      color(rr === p.results[lv].length ? C.g : rr ? C.ink : C.r); doc.text(`${rr}/${p.results[lv].length} right`, W - M - 3, y + .6, {align: 'right'});
