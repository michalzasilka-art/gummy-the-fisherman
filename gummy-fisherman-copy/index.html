        const head = e.skipped ? (e.ok ? 'RIGHT (round finished early)' : 'WRONG (round finished early)') : e.pick < 0 ? 'WRONG - time ran out' : e.ok ? 'RIGHT' : 'WRONG';
        doc.setFillColor(...(e.ok ? C.g : C.r)); doc.circle(M + 2.2, y - 1.3, 2.2, 'F');
        doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.text(String(k + 1), M + 2.2, y - .3, {align: 'center'});
        color(e.ok ? C.g : C.r); doc.setFontSize(10); doc.text(head, M + 7, y); y += 5.5;
        const X = M + 7;
        if (e.skipped) { y += 1; return; }
        const pickMark = (i) => (i === e.pick ? [{text: '  < picked', c: C.muted}] : []);
        if (e.mode === 'sentence') {
          e.items.forEach((it, i) => rich([{text: (it.target ? 'has the mistake:  ' : 'no mistake:  '), c: C.muted}, {text: it.text, c: it.target ? C.g : C.r, bold: i === e.pick}, ...pickMark(i)], X));
        } else if (e.mode === 'fill') {
          rich([{text: e.before}, {text: '______', c: C.muted}, {text: e.after}], X);
          rich(e.items.flatMap((it, i) => [{text: it.text, c: it.target ? C.g : C.r, bold: true, under: i === e.pick}, {text: i === e.pick ? ' (picked)' : '', c: C.muted}, {text: '      '}]), X);
        } else {
          const ti = e.items.findIndex((it) => it.target);
          rich(e.items.map((it, i) => ({text: it.text + ' ', c: i === ti ? C.r : C.ink, strike: i === ti, under: i === e.pick && i !== ti})), X);
          rich([{text: 'Correct: ', c: C.muted}, {text: e.items[ti].fix, c: C.g, bold: true}, ...(!e.ok && e.pick >= 0 ? [{text: '      Tapped: ', c: C.muted}, {text: e.items[e.pick].text, c: C.r}] : [])], X);
        }
        y += 2.5;
      });
      y += 3;
    });
  });
  const who = list.length > 1 ? 'all-players' : t(list[0].name).toLowerCase().replace(/[^a-z0-9]+/g, '-');
  doc.save(`gummy-answers-${who}-${new Date().toISOString().slice(0, 10)}.pdf`);
}

/* ================= NAV ================= */
function stopGame() { if (G) cancelAnimationFrame(G.timer); G = null; setR1Video(false); FIGHT.on = false; gvStop(); resumeWaiters.splice(0).forEach((f) => f()); $('ov').hidden = true; setMood('idle'); document.querySelectorAll('.leap,.catchscene,.review,.mg').forEach((e) => e.remove()); }
let resumeWaiters = [];
const untilResumed = () => (G && G.paused ? new Promise((r) => resumeWaiters.push(r)) : Promise.resolve());
function setGameMenu(open) { $('gmList').hidden = !open; $('menuBtn').setAttribute('aria-expanded', open); }
$('menuBtn').addEventListener('click', (e) => { e.stopPropagation(); setGameMenu($('gmList').hidden); });
document.addEventListener('click', (e) => { if (!e.target.closest('#gmenu')) setGameMenu(false); });
$('gmLeave').addEventListener('click', () => { setGameMenu(false); stopGame(); showLobby(); });
function showLobby() { if (phoneMode) phAll({t: 'lobby'}); $('game').hidden = true; $('weigh').hidden = true; $('board').hidden = true; $('lobby').hidden = false; renderLobby(); window.scrollTo(0, 0); if (pendingAch.length) flushAch(); }
$('lineupBtn').addEventListener('click', () => { stopGame(); showLobby(); });
$('againBtn').addEventListener('click', async () => { stopGame(); await flushAch(); startGame(); });
function renderMute() { $('muteBtn').innerHTML = muted ? '&#128263;' : '&#9834;'; }
$('muteBtn').addEventListener('click', () => { muted = !muted; store.set('gummyMuted', muted); renderMute(); if (master) master.gain.value = muted ? 0 : 1; });
renderMute();

// dev helper: ?dev forces a rarity for testing, e.g. ?dev=mythical
const dev = new URLSearchParams(location.search).get('dev');
if (dev && RARITY[dev]) rollRarity = () => dev;
if (dev === 'weigh') setTimeout(() => {
  startGame(); $('ov').hidden = true;
  const who = G.play === 'solo' ? G.players.map((_, pi) => pi) : [-1];
  G.catches = [0, 1, 2].flatMap((lv) => who.map((pi) => { const f = pickFish(), c = 5 + lv, t = 8; const kg = rand(f[2], f[3]); return {fish: f, level: lv, acc: c / t, c, t, kg, usd: fishValue(f, kg, lv, c / t), pi}; }));
  showWeighIn();
}, 50);

// lobby fits the screen: measure the window and shrink the lineup until it fits, so it never scrolls.
// On a very small screen (it would have to shrink below MIN_FIT) it scrolls normally instead.
const MIN_FIT = 0.55;
function fitLobby() {
  const lobby = $('lobby'), fit = $('lobbyFit');
  if (lobby.hidden) return;
  fit.style.transform = ''; fit.style.marginBottom = '';
  const cs = getComputedStyle(lobby);
  // small screens: the mini map sits above the logo and takes its own room
  const mm = $('miniMap'), ms = getComputedStyle(mm), mmH = ms.position === 'fixed' ? 0 : mm.offsetHeight + parseFloat(ms.marginBottom);
  const room = window.innerHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - mmH;
  const need = fit.offsetHeight;
  const s = Math.min(1, room / need);
  const on = s >= MIN_FIT;
  lobby.classList.toggle('fit', on);
  if (on && s < 1) {
    fit.style.transform = `scale(${s})`;
    fit.style.marginBottom = `${-need * (1 - s)}px`; // give back the space the shrink freed up, so it stays centred
  }
}
window.addEventListener('resize', fitLobby);
new ResizeObserver(fitLobby).observe($('lobbyFit'));
new MutationObserver(fitLobby).observe($('lobby'), {attributes: true, attributeFilter: ['hidden']});
document.fonts?.ready.then(fitLobby);
window.addEventListener('load', fitLobby);

renderLobby();
fitLobby();
})();
</script>
<script>
// Character pictures play as videos everywhere in the game (lobby, settings, rounds, catch screen, review).
// Glimmerwater's videos run forward then backward, so a plain loop ping-pongs; Frostfall Lake and Sapphire Sea have their
// own (video/pfp-<name>-frost / -sea.mp4: the friend in the snow / on the beach, start and end on the same frame). Any <img> showing a hero picture is
// swapped for a <video class="hv">, and every CSS rule written for those images is copied for the video.
(() => {
  'use strict';
  const VIDEOS = {
    'hero-stella.webp': 'stella', 'hero-foxino.webp': 'foxino', 'hero-fix.webp': 'pix', 'hero-ghost.webp': 'ghost',
    'hero-gummy6.webp': 'gummy', 'hero-rob.webp': 'rob',
  };
  const videoFor = (src) => { const f = String(src || '').split('?')[0].split('/').pop(); return VIDEOS[f]; };
  // the chosen location (set by the lobby, see renderLoc)
  const LOC_PFP = {mountain: '-frost', sea: '-sea'};
  const pfp = (name) => `video/pfp-${name}${LOC_PFP[window.__gummyLoc] || ''}`;
  document.addEventListener('gummyloc', () => document.querySelectorAll('video.hv').forEach((v) => {
    const u = pfp(v._pfp); if (v._src === u) return;
    v._src = u; v.poster = `${u}.jpg`; v.src = `${u}.mp4`; v.play().catch(() => {});
  }));

  // copy every rule that styles an img so the video lands in exactly the same box
  const sheet = document.createElement('style');
  document.head.appendChild(sheet);
  const copyRules = (rules, into) => {
    for (const r of rules) {
      if (r.cssRules && r.media) {
        try { into.insertRule(`@media ${r.media.mediaText}{}`, into.cssRules.length); copyRules(r.cssRules, into.cssRules[into.cssRules.length - 1]); } catch (e) {}
      } else if (r.selectorText && /\bimg\b/.test(r.selectorText)) {
        try { into.insertRule(`${r.selectorText.replace(/\bimg\b/g, 'video.hv')}{${r.style.cssText}}`, into.cssRules.length); } catch (e) {}
      }
    }
  };
  for (const s of [...document.styleSheets]) { if (s.ownerNode === sheet) continue; try { copyRules(s.cssRules, sheet.sheet); } catch (e) {} }
  sheet.sheet.insertRule('video.hv{object-fit:cover;pointer-events:none;background:#000}', 0);

  const swap = (img) => {
    const name = videoFor(img.getAttribute('src'));
    if (!name) return;
    const v = document.createElement('video');
    for (const a of img.attributes) if (a.name !== 'src' && a.name !== 'alt') v.setAttribute(a.name, a.value);
    v.classList.add('hv');
    v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true;
    v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.setAttribute('aria-hidden', 'true');
    v._pfp = name; v._src = pfp(name);
    v.poster = `${v._src}.jpg`;
    v.src = `${v._src}.mp4`;
    img.replaceWith(v);
    v.play().catch(() => {});
  };
  const scan = (root) => {
    if (root.nodeType !== 1) return;
    if (root.tagName === 'IMG') swap(root);
    else root.querySelectorAll('img').forEach(swap);
  };
  new MutationObserver((list) => {
    for (const m of list) {
      if (m.type === 'attributes') scan(m.target);
      else m.addedNodes.forEach(scan);
    }
  }).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['src'] });
  scan(document.body);
  // phones pause muted videos when the tab is hidden; start them again on return
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) document.querySelectorAll('video.hv').forEach((v) => v.play().catch(() => {}));
  });
})();
</script>
<script>
// Loading screen: download every picture and video the game shows, then open the game.
// Pictures are decoded, videos fully fetched (so they play straight from the browser cache). Gives up waiting after 40 s.
(() => {
  const FILES = ["video/six-pull.mp4","video/six-pull-poster.jpg","art/hero-fix.webp","art/hero-foxino.webp","art/hero-ghost.webp","art/hero-stella.webp","art/lobby-lake.webp","art/title.webp","art/title-frostfall.webp","art/title-sapphire.webp","art/r1-empty.webp","art/r2-empty.webp","art/r3-empty.webp","art/r1-gummy.webp","art/r1-face-happy.webp","art/r1-face-worried.webp","video/r1-gummy-idle.mp4","video/r1-gummy-try.mp4","video/r1-gummy-wrong.mp4","video/r1-gummy-catch.mp4","art/map.webp","video/pfp-gummy.jpg","video/pfp-gummy.mp4","video/pfp-rob.jpg","video/pfp-rob.mp4","video/pfp-foxino.jpg","video/pfp-foxino.mp4","video/pfp-ghost.jpg","video/pfp-ghost.mp4","video/pfp-pix.jpg","video/pfp-pix.mp4","video/pfp-stella.jpg","video/pfp-stella.mp4","art/card-foxino.webp","art/card-ghost.webp","art/card-pix.webp","art/card-stella.webp","art/badges/bad-luck.png","art/badges/beat-the-game.png","art/badges/epic-adventurer.png","art/badges/first-10k.png","art/badges/first-1k.png","art/badges/first-50k.png","art/badges/first-game-done.png","art/badges/fish-enjoyer.png","art/badges/legendary-lover.png","art/badges/mythical-hunter.png","art/badges/seasoned-angler.png","art/badges/six-seven.png","art/chain-index.webp","art/chain.webp","art/gummy-catch.webp","art/gummy-catch2.webp","art/gummy-catch3.webp","art/gummy-index.webp","art/icon-fire.png","art/icon-trophy.png","art/rod-bamboo.webp","art/rod-carbon.webp","art/rod-cosmic.webp","art/rod-golden.webp","art/scale.webp","fish/blossom-axolotl.webp","fish/gold-fish.webp","video/gold-pull-poster.jpg","art/lake-level1-golden.webp","fish/bubblegum-axolotl.webp","fish/chubby-clownfish.webp","fish/cosmic-blobfish.webp","fish/galaxy-axolotl.webp","fish/golden-thunder-axolotl.webp","fish/grape-splash-koi.webp","fish/grumpy-blobfish.webp","fish/lantern-angler.webp","fish/moonglow-axolotl.webp","fish/old-boot.webp","fish/pebble-axolotl.webp","fish/phantom-angler.webp","fish/storm-koi.webp","fish/sunset-koi.webp","fish/thunderbolt-angler.webp","fish/violet-spark-axolotl.webp","art/bg-glimmerwater-day.webp","art/bg-glimmerwater-sunset.webp","art/bg-glimmerwater-night.webp","art/bg-frostfall-day.webp","art/bg-frostfall-sunset.webp","art/bg-frostfall-night.webp","art/bg-sapphire-day.webp","art/bg-sapphire-sunset.webp","art/bg-sapphire-night.webp","art/six-round1.webp","art/six-round2.webp","art/six-round3.webp"];
  const KEEP = window.__gummyPics = [];
  const el = document.getElementById('loader'), fill = document.getElementById('ldFill'), num = document.getElementById('ldN');
  let done = 0, finished = false;
  const show = () => { const p = Math.round(done / FILES.length * 100); fill.style.width = p + '%'; num.textContent = p + '%'; el.setAttribute('aria-valuenow', p); };
  const one = (src) => new Promise((res) => {
    // Gummy's fight clips are handed to the game as in-memory copies (window.__gummyClips), so they never wait for the network
    if (/\.mp4$/.test(src)) { fetch(src).then((r) => r.blob()).then((b) => { if (/r1-gummy/.test(src)) (window.__gummyClips = window.__gummyClips || {})[src] = URL.createObjectURL(b); res(); }, res); return; }
    // pictures are kept (KEEP) and decoded at full size here, so a round background is ready the moment its round starts
    const im = new Image(); im.decoding = 'async'; KEEP.push(im);
    im.onload = () => (im.decode ? im.decode().catch(() => {}) : Promise.resolve()).then(res); im.onerror = () => res(); im.src = src;
  }).then(() => { done++; show(); });
  const finish = () => { if (finished) return; finished = true; fill.style.width = '100%'; num.textContent = '100%'; setTimeout(() => el.classList.add('done'), 250);
    if (window.__gvWarm) window.__gvWarm(); }; // the clip player is made (and their first frames decoded) before the first round
  // 6 downloads at a time, in the order the lobby needs them
  const queue = FILES.slice();
  const worker = async () => { while (queue.length) await one(queue.shift()); };
  Promise.all([...Array(6)].map(worker)).then(() => (document.fonts ? document.fonts.ready : null)).then(finish, finish);
  setTimeout(finish, 40000);
})();
</script>
